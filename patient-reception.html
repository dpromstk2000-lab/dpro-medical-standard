<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>当日受付 | DPRO MEDICAL</title>
<script src="config.js"></script>
<script src="auth-supabase-auth-client.js"></script>
<script src="patient-runtime-config.js?v=brushup8-1.3"></script>
<script src="patient-api-adapter.js"></script>
<script src="patient-reception-live.js?v=brushup8-1.3" defer></script>
<style>
:root{--bg:#f5f8fb;--card:#fff;--ink:#17324a;--muted:#637587;--line:#d9e4ec;--accent:#1769aa;--soft:#eaf4fb;--warn:#fff7e7;--ok:#edf8f1;--danger:#a92f2f;--dangerbg:#fff1f1}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(22,50,75,.05)}
.ok{background:var(--ok)}
.error{background:var(--dangerbg);border-color:#e9bbbb;color:#7e2222}
h1{font-size:23px;line-height:1.35;margin:0 0 8px}
h2{font-size:18px;margin:0 0 10px}
p{line-height:1.65;margin:8px 0}
.small{font-size:13px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:760;text-align:center;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:760;margin:14px 0 6px}
select{width:100%;min-height:48px;padding:12px 13px;border-radius:12px;border:1px solid #c8d7e2;background:#fff;font:inherit;color:var(--ink)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
nav a{color:var(--accent);font-size:14px;text-decoration:none;font-weight:700}
.meta{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px}
.meta div:nth-child(odd){color:var(--muted)}
.hidden{display:none!important}
@media(max-width:430px){.wrap{padding-left:14px;padding-right:14px}.meta{grid-template-columns:115px 1fr}}
@media(max-width:390px){.meta{grid-template-columns:1fr}.meta div:nth-child(odd){font-size:12px;margin-top:4px}}
</style>
</head>
<body>
<main class="wrap">
  <nav><a href="member.html">← 患者TOP</a></nav>

  <div id="errorBox" class="card error hidden" role="alert"></div>

  <div class="card" id="receptionFormCard">
    <h1>当日受付</h1>
    <p class="small">本日の予約を選択して受付します。</p>
    <label for="appointmentSelect">予約</label>
    <select id="appointmentSelect">
      <option value="">読み込み中...</option>
    </select>
    <button id="acceptBtn" class="btn primary wide" type="button" disabled>受付する</button>
  </div>

  <div id="accepted" class="card ok hidden">
    <h2>受付済みです</h2>
    <div class="meta">
      <div>受付番号</div><div id="queueNumber">-</div>
      <div>受付状況</div><div id="queueStatus">受付済み</div>
    </div>
    <a class="btn primary wide" href="patient-wait-status.html">待ち状況を見る</a>
  </div>
</main>
</body>
</html>
