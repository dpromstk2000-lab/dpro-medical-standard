<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPRO MEDICAL SYSTEM CHECK</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
body{margin:0}
main{max-width:1100px;margin:0 auto;padding:24px}
header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 6px}
p{margin:4px 0}
.panel{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:16px;margin-top:16px}
.meta{display:flex;gap:12px;flex-wrap:wrap}
.badge{border:1px solid #ccd5e1;border-radius:999px;padding:6px 10px;font-size:13px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.check{border:1px solid #dfe5ee;border-radius:12px;padding:14px;background:#fff}
.check h2{font-size:15px;margin:0 0 8px}
.status{font-weight:700}
small{color:#667085}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.notice{font-size:13px;color:#5d6675}
footer{margin:22px 0 6px;font-size:12px;color:#667085}
</style>
<script src="config.js"></script>
<script src="auth-supabase-auth-client.js"></script>
</head>
<body>
<main>
<header>
<div>
<h1>DPRO MEDICAL SYSTEM CHECK</h1>
<p>営業前・運用前の安全確認</p>
</div>
<button id="rerun">再チェック</button>
</header>

<section class="panel">
<div class="meta">
<span class="badge" id="mode">MODE: -</span>
<span class="badge" id="source">DATA SOURCE: -</span>
<span class="badge">PRODUCTION GUARD: REQUIRED</span>
<span class="badge">SECRET DISPLAY: BLOCKED</span>
</div>
<p class="notice">Service Role / Channel Secret / Access Token / 患者の医療詳細は表示しません。</p>
</section>

<section class="grid" id="checks"></section>

<footer>
API PATH: /api/medical/v1/system-check<br>
STATUS: PASS / WARN / FAIL / SKIP | TAB-E MED-SYSTEM-6 V1.1
</footer>
</main>

<script>
const KEYS = [
  "DATABASE","API","AUTH","TENANT","PATIENT","APPOINTMENT","QUEUE","VISIT",
  "QUESTIONNAIRE","LINE","HP","FEATURE FLAG","AUDIT","PRODUCTION GUARD"
];

const now = () => new Date().toISOString();

function resultSet(status, message){
  return KEYS.map(key => ({key, status, message, checked_at: now()}));
}

function setMeta(mode, source){
  document.getElementById("mode").textContent = "MODE: " + mode.toUpperCase();
  document.getElementById("source").textContent = "DATA SOURCE: " + source;
}

async function loadResults(){
  const cfg = window.DPRO_MEDICAL_CONFIG || {};
  const mode = String(cfg.environmentMode || "unknown").toLowerCase();
  const mockMode = cfg.mockMode === true;
  const apiBaseUrl = String(cfg.apiBaseUrl || "").replace(/\/+$/, "");
  const path = String(cfg.systemCheckPath || "/api/medical/v1/system-check");

  // Production + mock is always a guard failure.
  if(mode === "production" && mockMode){
    setMeta(mode, "INVALID MOCK");
    return resultSet("FAIL", "PRODUCTIONでMOCKは禁止");
  }

  // Explicit demo mock only. Never claim real validation.
  if(mode === "demo" && mockMode){
    setMeta(mode, "MOCK");
    return resultSet("SKIP", "DEMO MOCK / 実API未検証");
  }

  // No API configured: never PASS.
  if(!apiBaseUrl){
    setMeta(mode, "UNCONNECTED");
    if(mode === "production"){
      return resultSet("FAIL", "PRODUCTION / 実API未接続");
    }
    return resultSet("WARN", "実API未接続");
  }

  setMeta(mode, "API");

  try{
    if(!window.DPRO_MEDICAL_AUTH || typeof window.DPRO_MEDICAL_AUTH.requireActor !== "function") {
      return resultSet("FAIL", "Browser Auth Runtime未接続");
    }
    await window.DPRO_MEDICAL_AUTH.requireActor("staff", {
      loginUrl: "login.html",
      requiredPermissions: ["system_check.execute"]
    });
    const headers = {"Accept":"application/json"};
    const tokenProvider = window.DPRO_MEDICAL_AUTH?.getAccessToken;
    if(typeof tokenProvider === "function"){
      const token = await tokenProvider();
      if(token) headers.Authorization = `Bearer ${token}`;
    }
    if(typeof cfg.clinicId === "string" && cfg.clinicId) headers["X-DPRO-Clinic-ID"] = cfg.clinicId;
    const res = await fetch(apiBaseUrl + path, {
      credentials: "include",
      headers
    });
    if(!res.ok){
      return resultSet(mode === "production" ? "FAIL" : "WARN", "SYSTEM CHECK API確認失敗");
    }
    const envelope = await res.json();
    const data = envelope && envelope.ok === true && envelope.data ? envelope.data : envelope;
    if(envelope && envelope.ok === false){
      return resultSet(mode === "production" ? "FAIL" : "WARN", "SYSTEM CHECK APIエラー");
    }

    // Server response is filtered to the expected public fields and may use the CORE common envelope.
    const rows = Array.isArray(data?.results) ? data.results : [];
    const byKey = new Map(rows.map(r => [String(r.key), r]));
    return KEYS.map(key => {
      const r = byKey.get(key);
      if(!r){
        return {key, status:"WARN", message:"結果未取得", checked_at:now()};
      }
      const allowed = ["PASS","WARN","FAIL","SKIP"];
      const status = allowed.includes(String(r.status)) ? String(r.status) : "WARN";
      return {
        key,
        status,
        message: String(r.message || "").slice(0,160),
        checked_at: String(r.checked_at || now())
      };
    });
  }catch(e){
    return resultSet(mode === "production" ? "FAIL" : "WARN", "SYSTEM CHECK API未接続");
  }
}

async function render(){
  const host = document.getElementById("checks");
  host.textContent = "";
  const results = await loadResults();

  results.forEach(r => {
    const el = document.createElement("article");
    el.className = "check";

    const h = document.createElement("h2");
    h.textContent = r.key;

    const s = document.createElement("div");
    s.className = "status";
    s.textContent = r.status;

    const m = document.createElement("small");
    m.textContent = r.message || "";

    el.append(h,s,m);
    host.appendChild(el);
  });
}

document.getElementById("rerun").addEventListener("click", render);
render();
</script>
</body>
</html>
