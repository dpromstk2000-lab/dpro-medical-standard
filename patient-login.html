<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>患者ログイン | DPRO MEDICAL</title>
<script src="config.js"></script>
<script src="auth-supabase-auth-client.js"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17324a;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:480px;margin:0 auto;padding:32px 16px}.card{background:#fff;border:1px solid #d9e4ec;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(23,50,74,.08)}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;color:#637587}label{display:block;font-weight:750;margin:16px 0 6px}input{width:100%;min-height:50px;padding:12px;border:1px solid #c8d7e2;border-radius:12px;font:inherit}button{width:100%;min-height:50px;margin-top:18px;border:0;border-radius:12px;background:#1769aa;color:#fff;font:750 16px/1.2 inherit;cursor:pointer}button:disabled{opacity:.55}.msg{margin-top:14px;padding:11px 12px;border-radius:12px;background:#eef5fb;font-size:14px;white-space:pre-wrap}.error{background:#fff1f1;color:#842626}.small{font-size:12px;color:#637587}.links{margin-top:16px;text-align:center}.links a{color:#1769aa}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1>患者ログイン</h1>
<p><strong>メールアドレスとパスワード</strong> を入力してログインしてください。</p>
<form id="form" autocomplete="on">
<label for="email">メールアドレス</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">ログイン</button>
</form>
<div id="message" class="msg">認証状態を確認しています...</div>
<p class="small">登録済みの患者アカウントのみご利用いただけます。</p>
<div class="links"><a href="login.html">スタッフログインはこちら</a></div>
</section></main>
<script>
(function(){
  const form=document.getElementById('form'),button=document.getElementById('submit'),message=document.getElementById('message');
  const params=new URLSearchParams(location.search), requestedNext=params.get('next')||'';
  const show=(text,error=false)=>{message.textContent=text;message.classList.toggle('error',!!error)};
  async function contextAndRoute(){
    const context=await DPRO_MEDICAL_AUTH.getMedicalContext();
    if(context.actor_type!=='patient'||!context.patient_id) throw Object.assign(new Error('患者紐付けを確認できません。'),{code:'AUTHORIZATION_FAILED'});
    const target=DPRO_MEDICAL_AUTH.routeAfterLogin(context,requestedNext,'patient');
    location.replace(target);
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();button.disabled=true;show('ログインしています...');
    try{await DPRO_MEDICAL_AUTH.signInPatient({email:form.email.value,password:form.password.value});await contextAndRoute();}
    catch(err){if(err.code==='AUTHORIZATION_FAILED'||err.code==='AUTH_ACTOR_MISMATCH'||err.code==='CROSS_CLINIC_DENIED'){try{await DPRO_MEDICAL_AUTH.signOut();}catch(_){}}show('ログインできませんでした。 '+(err.code||'AUTH_ERROR'),true);button.disabled=false;}
  });
  (async()=>{try{const session=await DPRO_MEDICAL_AUTH.getSession();if(!session){show('メールアドレスとパスワードを入力してください。');return;}await contextAndRoute();}catch(err){show(err.code==='AUTH_CONFIG_REQUIRED'?'公開Auth設定を確認してください。':'ログインしてください。',err.code==='AUTH_CONFIG_REQUIRED');}})();
})();
</script>
</body>
</html>
