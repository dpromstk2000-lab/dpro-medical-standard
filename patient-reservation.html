<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約 | DPRO MEDICAL</title><script src="config.js"></script><script src="auth-supabase-auth-client.js"></script><script src="patient-runtime-config.js"></script><script src="patient-api-adapter.js"></script><style>
:root{--bg:#f5f8fb;--card:#fff;--ink:#17324a;--muted:#637587;--line:#d9e4ec;--accent:#1769aa;--soft:#eaf4fb;--warn:#fff7e7;--ok:#edf8f1;--danger:#a92f2f;--dangerbg:#fff1f1}
*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 40px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.clinic{font-size:18px;font-weight:850}.user{font-size:14px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(22,50,75,.05)}.status{background:var(--soft)}.warn{background:var(--warn)}.ok{background:var(--ok)}.error{background:var(--dangerbg);border-color:#e9bbbb;color:#7e2222}h1{font-size:23px;line-height:1.35;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.65;margin:8px 0}.small{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:760;text-align:center;cursor:pointer;font-size:15px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:#fff;color:var(--danger);border-color:#e5bcbc}.btn.wide{grid-column:1/-1;width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:760}.big-number{font-size:42px;font-weight:900;line-height:1}label{display:block;font-weight:760;margin:14px 0 6px}input,select,textarea{width:100%;min-height:48px;padding:12px 13px;border-radius:12px;border:1px solid #c8d7e2;background:#fff;font:inherit;color:var(--ink)}input[type=checkbox],input[type=radio]{width:auto;min-height:auto}.checkrow{display:flex;align-items:flex-start;gap:8px;margin:9px 0}.checkrow label{margin:0;font-weight:500}.options{display:grid;gap:8px}.options .checkrow{padding:8px 10px;border:1px solid var(--line);border-radius:10px}.field-error{font-size:13px;color:#982d2d;margin-top:5px}textarea{min-height:108px;resize:vertical}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}nav a{color:var(--accent);font-size:14px;text-decoration:none;font-weight:700}.note{padding:11px 12px;border-radius:12px;background:#fff8e8;font-size:13px;line-height:1.55}hr{border:0;border-top:1px solid var(--line);margin:16px 0}.list{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.meta{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px}.meta div:nth-child(odd){color:var(--muted)}.hidden{display:none!important}.mutedbox{padding:18px;border:1px dashed #b9c9d5;border-radius:14px;text-align:center;color:var(--muted);background:#fbfdff}.success-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.spinner{opacity:.65}.nowrap{white-space:nowrap}
@media(max-width:430px){.wrap{padding-left:14px;padding-right:14px}.meta{grid-template-columns:115px 1fr}.btn{min-height:50px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.btn.wide{grid-column:auto}.meta{grid-template-columns:1fr}.meta div:nth-child(odd){font-size:12px;margin-top:4px}}
@media(max-width:360px){.wrap{padding-left:11px;padding-right:11px}h1{font-size:21px}.card{padding:14px}.btn{font-size:14px}}
</style></head><body><main class="wrap"><nav><a href="member.html">← 患者TOP</a></nav>
<div id="errorBox" class="card error hidden" role="alert"></div><div id="offBox" class="card warn hidden"><h1>予約</h1><p>この医院では現在、予約機能を利用できません。</p></div>
<div id="bookingCard" class="card"><h1>予約する</h1><p class="small">空き枠を選んで予約します。予約状態はCOREの返却値を表示します。</p>
<label for="appointmentType">予約種別</label><select id="appointmentType"><option>読み込み中...</option></select><p class="small" id="modeInfo"></p>
<div id="slotBooking"><label for="appointmentDate">希望日</label><input id="appointmentDate" type="date" value="2026-08-18"><button id="loadSlotsBtn" class="btn wide" type="button">空き枠を表示</button><label for="appointmentSlot">空き枠</label><select id="appointmentSlot"><option value="">先に空き枠を表示してください</option></select></div>
<div id="queueRoute" class="card status hidden"><strong>順番受付</strong><p>順番受付は「当日受付」から行ってください。</p><a class="btn primary wide" href="patient-reception.html">当日受付へ</a></div>
<div id="unsupportedRoute" class="card warn hidden"><strong>この予約方式はこの画面では受付していません。</strong><p>医院の案内に従ってください。</p></div>
<hr><button id="confirmBtn" class="btn primary wide" type="button">予約内容を確認</button></div>
<div id="confirm" class="card status hidden"><h2>予約確認</h2><div class="meta"><div>予約種別</div><div id="confirmType"></div><div>方式</div><div id="confirmMode"></div><div>日時</div><div id="confirmDateTime"></div><div>slot</div><div id="confirmSlot" class="success-id"></div></div><button id="createBtn" class="btn primary wide" type="button">予約を確定</button></div>
<div id="success" class="card ok hidden"><h2>予約を受け付けました</h2><div class="meta"><div>appointment_id</div><div id="createdId" class="success-id"></div><div>status</div><div id="createdStatus"></div></div><p class="small">状態はCOREレスポンスに基づきます。</p><a id="detailLink" class="btn wide" href="patient-reservation-detail.html">予約詳細を見る</a></div>
<script>
(async()=>{
let api,types=[],slots=[],selectedType=null,selectedSlot=null,submitting=false;const $=id=>document.getElementById(id);
function showError(message,code){$("errorBox").textContent=message+(code?` (${code})`:"");$("errorBox").classList.remove("hidden");}
function clearError(){$("errorBox").classList.add("hidden");$("errorBox").textContent="";}
function source(){return new URLSearchParams(location.search).get("source")==="line"?"line":"web";}
function featureAllows(type,features){const m=type.booking_mode;if(m==="datetime")return features.feature_datetime_booking===true;if(m==="time_window")return features.feature_time_window===true;if(m==="queue")return features.feature_queue===true;return true;}
function renderMode(){selectedType=types.find(t=>t.appointment_type_id===$("appointmentType").value)||null;const m=selectedType?.booking_mode||"";$("modeInfo").textContent=m?`booking_mode: ${m}`:"";$("slotBooking").classList.toggle("hidden",!["datetime","time_window"].includes(m));$("queueRoute").classList.toggle("hidden",m!=="queue");$("unsupportedRoute").classList.toggle("hidden",!["complete_reservation","walk_in"].includes(m));$("confirmBtn").disabled=!["datetime","time_window"].includes(m);$("confirm").classList.add("hidden");selectedSlot=null;}
async function loadSlots(){clearError();selectedSlot=null;$("appointmentSlot").innerHTML='<option value="">読み込み中...</option>';try{const r=await api.getAppointmentSlots({date:$("appointmentDate").value,appointment_type_id:$("appointmentType").value});slots=(r.data||[]).filter(s=>s.available!==false&&s.appointment_slot_id);$("appointmentSlot").innerHTML='<option value="">選択してください</option>'+slots.map(s=>`<option value="${s.appointment_slot_id}">${new Date(s.start_at).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}〜${new Date(s.end_at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</option>`).join("");if(!slots.length)showError("選択できる予約枠がありません。");}catch(e){showError("予約枠を取得できませんでした。もう一度お試しください。",e.code);$("appointmentSlot").innerHTML='<option value="">取得失敗</option>';}}
function showConfirm(){clearError();selectedType=types.find(t=>t.appointment_type_id===$("appointmentType").value)||null;selectedSlot=slots.find(s=>s.appointment_slot_id===$("appointmentSlot").value)||null;if(!selectedType||!selectedSlot){showError("予約種別と空き枠を選択してください。");return;}$("confirmType").textContent=selectedType.name||selectedType.appointment_type_name||selectedType.appointment_type_id;$("confirmMode").textContent=selectedType.booking_mode;$("confirmDateTime").textContent=`${selectedSlot.start_at} 〜 ${selectedSlot.end_at}`;$("confirmSlot").textContent=selectedSlot.appointment_slot_id;$("confirm").classList.remove("hidden");$("confirm").scrollIntoView({behavior:"smooth",block:"start"});}
async function create(){if(submitting)return;clearError();if(!selectedType||!selectedSlot){showError("予約内容をもう一度確認してください。");return;}submitting=true;$("createBtn").disabled=true;$("createBtn").textContent="処理中...";try{const r=await api.createAppointment({appointment_type_id:selectedType.appointment_type_id,appointment_slot_id:selectedSlot.appointment_slot_id,appointment_date:selectedSlot.appointment_date||$("appointmentDate").value,start_at:selectedSlot.start_at,end_at:selectedSlot.end_at,source:source()});const a=r.data||{};$("createdId").textContent=a.appointment_id||"-";$("createdStatus").textContent=`${a.status||"-"} / ${DPRO_MEDICAL_PATIENT_API.getStatusLabel(a.status)}`;$("detailLink").href=`reservation-detail.html?appointment_id=${encodeURIComponent(a.appointment_id||"")}`;$("success").classList.remove("hidden");$("confirm").classList.add("hidden");$("bookingCard").classList.add("hidden");}catch(e){showError("予約処理に失敗しました。もう一度お試しください。",e.code);}finally{submitting=false;$("createBtn").disabled=false;$("createBtn").textContent="予約を確定";}}
window.showConfirm=showConfirm;
try{const runtime=await DPRO_MEDICAL_PATIENT_API.prepareRuntime();api=DPRO_MEDICAL_PATIENT_API.createPatientApiAdapter(runtime);const ctx=(await api.getContext()).data,f=ctx.features||(runtime==="demo_mock"?window.DPRO_MEDICAL_PATIENT_MOCK.feature_flags:{});if(!(f.feature_web_booking||f.feature_line_booking)){$("bookingCard").classList.add("hidden");$("offBox").classList.remove("hidden");return;}types=(await api.getAppointmentTypes()).data||[];types=types.filter(t=>featureAllows(t,f));$("appointmentType").innerHTML=types.map(t=>`<option value="${t.appointment_type_id}">${t.name||t.appointment_type_name||t.appointment_type_id}</option>`).join("");if(!types.length){$("bookingCard").classList.add("hidden");$("offBox").classList.remove("hidden");return;}renderMode();$("appointmentType").addEventListener("change",renderMode);$("appointmentDate").addEventListener("change",()=>{slots=[];$("appointmentSlot").innerHTML='<option value="">空き枠を再取得してください</option>';$("confirm").classList.add("hidden");});$("loadSlotsBtn").addEventListener("click",loadSlots);$("appointmentSlot").addEventListener("change",()=>{selectedSlot=slots.find(s=>s.appointment_slot_id===$("appointmentSlot").value)||null;});$("confirmBtn").addEventListener("click",showConfirm);$("createBtn").addEventListener("click",create);}catch(e){showError("予約画面を準備できませんでした。もう一度お試しください。",e.code);$("confirmBtn").disabled=true;}
})();
</script></main></body></html>
