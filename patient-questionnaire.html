<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB問診 | DPRO MEDICAL</title><script src="config.js"></script><script src="auth-supabase-auth-client.js"></script><script src="patient-runtime-config.js"></script><script src="patient-api-adapter.js"></script><style>
:root{--bg:#f5f8fb;--card:#fff;--ink:#17324a;--muted:#637587;--line:#d9e4ec;--accent:#1769aa;--soft:#eaf4fb;--warn:#fff7e7;--ok:#edf8f1;--danger:#a92f2f;--dangerbg:#fff1f1}
*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 40px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.clinic{font-size:18px;font-weight:850}.user{font-size:14px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(22,50,75,.05)}.status{background:var(--soft)}.warn{background:var(--warn)}.ok{background:var(--ok)}.error{background:var(--dangerbg);border-color:#e9bbbb;color:#7e2222}h1{font-size:23px;line-height:1.35;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.65;margin:8px 0}.small{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:760;text-align:center;cursor:pointer;font-size:15px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:#fff;color:var(--danger);border-color:#e5bcbc}.btn.wide{grid-column:1/-1;width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:760}.big-number{font-size:42px;font-weight:900;line-height:1}label{display:block;font-weight:760;margin:14px 0 6px}input,select,textarea{width:100%;min-height:48px;padding:12px 13px;border-radius:12px;border:1px solid #c8d7e2;background:#fff;font:inherit;color:var(--ink)}input[type=checkbox],input[type=radio]{width:auto;min-height:auto}.checkrow{display:flex;align-items:flex-start;gap:8px;margin:9px 0}.checkrow label{margin:0;font-weight:500}.options{display:grid;gap:8px}.options .checkrow{padding:8px 10px;border:1px solid var(--line);border-radius:10px}.field-error{font-size:13px;color:#982d2d;margin-top:5px}textarea{min-height:108px;resize:vertical}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}nav a{color:var(--accent);font-size:14px;text-decoration:none;font-weight:700}.note{padding:11px 12px;border-radius:12px;background:#fff8e8;font-size:13px;line-height:1.55}hr{border:0;border-top:1px solid var(--line);margin:16px 0}.list{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.meta{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px}.meta div:nth-child(odd){color:var(--muted)}.hidden{display:none!important}.mutedbox{padding:18px;border:1px dashed #b9c9d5;border-radius:14px;text-align:center;color:var(--muted);background:#fbfdff}.success-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.spinner{opacity:.65}.nowrap{white-space:nowrap}
@media(max-width:430px){.wrap{padding-left:14px;padding-right:14px}.meta{grid-template-columns:115px 1fr}.btn{min-height:50px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.btn.wide{grid-column:auto}.meta{grid-template-columns:1fr}.meta div:nth-child(odd){font-size:12px;margin-top:4px}}
@media(max-width:360px){.wrap{padding-left:11px;padding-right:11px}h1{font-size:21px}.card{padding:14px}.btn{font-size:14px}}
</style></head><body><main class="wrap"><nav><a href="member.html">← 患者TOP</a></nav><div id="errorBox" class="card error hidden" role="alert"></div><div id="off" class="card warn hidden"><h1>WEB問診</h1><p>この医院ではWEB問診を使用していません。</p></div><div id="content" class="card"><h1 id="title">来院前WEB問診</h1><p id="description" class="small"></p><form id="form"><div id="questions"></div><button id="submitBtn" class="btn primary wide" type="submit">問診を送信</button></form></div><div id="done" class="card ok hidden"><h2>問診を受け付けました</h2><div class="meta"><div>submission_id</div><div id="submissionId" class="success-id"></div><div>status</div><div id="submissionStatus"></div></div><a class="btn primary wide" href="member.html">患者TOPへ戻る</a></div>
<script>(async()=>{
let api,questionnaireId=null,questions=[],submitting=false;const $=id=>document.getElementById(id);function error(msg,code){$("errorBox").textContent=msg+(code?` (${code})`:"");$("errorBox").classList.remove("hidden");}function clearError(){$("errorBox").classList.add("hidden");}
function qid(q){return q.questionnaire_question_id||q.question_id||q.id||null;}function opts(q){return Array.isArray(q.options)?q.options:[];}
function safeCondition(cond){if(!cond)return {supported:true,show:true};if(typeof cond!=="object")return {supported:false,show:false};const ref=cond.questionnaire_question_id||cond.question_id;const op=cond.operator||"equals";if(!ref||!["equals","not_equals","in"].includes(op))return {supported:false,show:false};const el=document.querySelector(`[data-qid="${CSS.escape(ref)}"]`);if(!el)return {supported:true,show:false};let val;if(el.dataset.type==="yes_no")val=document.querySelector(`input[name="q_${CSS.escape(ref)}"]:checked`)?.value||"";else if(el.dataset.type==="multi_select")val=[...document.querySelectorAll(`input[name="q_${CSS.escape(ref)}"]:checked`)].map(x=>x.value);else if(el.dataset.type==="checkbox")val=document.querySelector(`input[name="q_${CSS.escape(ref)}"]`)?.checked?"true":"false";else val=document.querySelector(`[name="q_${CSS.escape(ref)}"]`)?.value||"";let show=false;if(op==="equals")show=Array.isArray(val)?val.includes(String(cond.value)):String(val)===String(cond.value);if(op==="not_equals")show=String(val)!==String(cond.value);if(op==="in")show=Array.isArray(cond.value)&&cond.value.map(String).includes(String(val));return {supported:true,show};}
function evaluateConditions(){let unsupported=false;questions.forEach(q=>{if(!q.show_condition)return;const row=document.querySelector(`[data-question-row="${CSS.escape(qid(q))}"]`);const r=safeCondition(q.show_condition);if(!r.supported){unsupported=true;row?.classList.add("hidden");}else row?.classList.toggle("hidden",!r.show);});if(unsupported){$("submitBtn").disabled=true;error("この質問票には現在未対応の表示条件があります。安全のため送信できません。","UNSUPPORTED_SHOW_CONDITION");}else{$("submitBtn").disabled=false;}}
function renderQuestion(q){const id=qid(q);if(!id)throw new Error("QUESTION_ID_MISSING");const type=q.question_type||q.type;const required=q.required===true;const req=required?' <span class="small">必須</span>':'';let body='';if(type==="notice")body=`<div class="note">${escapeHtml(q.label||q.notice||"")}</div>`;else if(type==="text")body=`<label>${escapeHtml(q.label||"")}${req}</label><input name="q_${escapeAttr(id)}" type="text">`;else if(type==="textarea")body=`<label>${escapeHtml(q.label||"")}${req}</label><textarea name="q_${escapeAttr(id)}"></textarea>`;else if(type==="number")body=`<label>${escapeHtml(q.label||"")}${req}</label><input name="q_${escapeAttr(id)}" type="number" step="any">`;else if(type==="date")body=`<label>${escapeHtml(q.label||"")}${req}</label><input name="q_${escapeAttr(id)}" type="date">`;else if(type==="single_select")body=`<label>${escapeHtml(q.label||"")}${req}</label><select name="q_${escapeAttr(id)}"><option value="">選択してください</option>${opts(q).map(o=>`<option value="${escapeAttr(typeof o==='object'?(o.value??o.label):o)}">${escapeHtml(typeof o==='object'?(o.label??o.value):o)}</option>`).join('')}</select>`;else if(type==="multi_select")body=`<label>${escapeHtml(q.label||"")}${req}</label><div class="options">${opts(q).map(o=>{const v=typeof o==='object'?(o.value??o.label):o,l=typeof o==='object'?(o.label??o.value):o;return `<div class="checkrow"><input type="checkbox" name="q_${escapeAttr(id)}" value="${escapeAttr(v)}"><label>${escapeHtml(l)}</label></div>`}).join('')}</div>`;else if(type==="yes_no")body=`<label>${escapeHtml(q.label||"")}${req}</label><div class="options"><div class="checkrow"><input type="radio" name="q_${escapeAttr(id)}" value="yes"><label>はい</label></div><div class="checkrow"><input type="radio" name="q_${escapeAttr(id)}" value="no"><label>いいえ</label></div></div>`;else if(type==="checkbox")body=`<div class="checkrow"><input type="checkbox" name="q_${escapeAttr(id)}" value="true"><label>${escapeHtml(q.label||"")}${req}</label></div>`;else throw Object.assign(new Error("UNSUPPORTED_QUESTION_TYPE"),{code:"UNSUPPORTED_QUESTION_TYPE"});return `<div class="question" data-question-row="${escapeAttr(id)}" data-qid="${escapeAttr(id)}" data-type="${escapeAttr(type)}">${body}<div class="field-error hidden" data-error-for="${escapeAttr(id)}"></div></div>`;}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}function escapeAttr(s){return escapeHtml(s);}
function collect(){const answers=[];let valid=true;questions.forEach(q=>{const id=qid(q),row=document.querySelector(`[data-question-row="${CSS.escape(id)}"]`);if(!row||row.classList.contains("hidden")||(q.question_type||q.type)==="notice")return;const type=q.question_type||q.type;let value;if(type==="multi_select")value=[...document.querySelectorAll(`input[name="q_${CSS.escape(id)}"]:checked`)].map(x=>x.value);else if(type==="yes_no")value=document.querySelector(`input[name="q_${CSS.escape(id)}"]:checked`)?.value||"";else if(type==="checkbox")value=document.querySelector(`input[name="q_${CSS.escape(id)}"]`)?.checked===true;else value=document.querySelector(`[name="q_${CSS.escape(id)}"]`)?.value??"";const empty=Array.isArray(value)?value.length===0:(type==="checkbox"?!value:String(value).trim()==="");const err=document.querySelector(`[data-error-for="${CSS.escape(id)}"]`);if(q.required===true&&empty){valid=false;if(err){err.textContent="この項目は必須です。";err.classList.remove("hidden");}}else if(err)err.classList.add("hidden");if(!empty)answers.push({questionnaire_question_id:id,value});});return {valid,answers};}
try{const runtime=await DPRO_MEDICAL_PATIENT_API.prepareRuntime();api=DPRO_MEDICAL_PATIENT_API.createPatientApiAdapter(runtime);let list;try{list=(await api.getQuestionnaires()).data||[];}catch(e){if(e.code==="FEATURE_DISABLED"){$("content").classList.add("hidden");$("off").classList.remove("hidden");return;}throw e;}questionnaireId=new URLSearchParams(location.search).get("questionnaire_id")||list[0]?.questionnaire_id;if(!questionnaireId){error("利用できる問診票がありません。");$("submitBtn").disabled=true;return;}const d=(await api.getQuestionnaireDetail({questionnaire_id:questionnaireId})).data||{};const qn=d.questionnaire||d;questions=d.questions||qn.questions||[];$("title").textContent=qn.title||"来院前WEB問診";$("description").textContent=qn.description||"";$("questions").innerHTML=questions.map(renderQuestion).join("");$("questions").addEventListener("change",evaluateConditions);evaluateConditions();$("form").addEventListener("submit",async e=>{e.preventDefault();if(submitting)return;clearError();const {valid,answers}=collect();if(!valid){error("必須項目を確認してください。");return;}if(!answers.length){error("回答を入力してください。");return;}submitting=true;$("submitBtn").disabled=true;$("submitBtn").textContent="送信中...";try{const r=await api.submitQuestionnaire({questionnaire_id:questionnaireId,answers});$("submissionId").textContent=r.data?.submission_id||"-";$("submissionStatus").textContent=r.data?.status||"-";$("done").classList.remove("hidden");$("content").classList.add("hidden");}catch(err){error("問診の送信に失敗しました。もう一度お試しください。",err.code);}finally{submitting=false;$("submitBtn").disabled=false;$("submitBtn").textContent="問診を送信";}});}catch(e){error("問診票を読み込めませんでした。",e.code);$("submitBtn").disabled=true;}
})();</script></main></body></html>
