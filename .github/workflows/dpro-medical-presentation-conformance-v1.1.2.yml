name: DPRO MEDICAL Presentation Conformance Repair V1.1.2
# Hotfix 2026-09-04: remove CSS/JS from Python f-string parsing

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-medical-presentation-conformance-v1121
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install render and QR QA tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils libzbar0
          python -m pip install --upgrade pip
          python -m pip install playwright qrcode[pil] pypdf pillow pyzbar pyyaml
          python -m playwright install --with-deps chromium

      - name: Repair MEDICAL presentation artifacts to formal DPRO masters
        shell: bash
        run: |
          cat > /tmp/medical_v11.py <<'PY'
          from pathlib import Path
          import base64, hashlib, json, subprocess, shutil, html
          from pypdf import PdfReader
          import qrcode

          ROOT = Path.cwd()
          ASSET = ROOT / "assets" / "presentation"
          ASSET.mkdir(parents=True, exist_ok=True)

          BASE = "https://dpromstk2000-lab.github.io/dpro-medical-standard"
          DEMO = BASE + "/medical-public-demo.html"
          GUIDE = BASE + "/guide-center.html"
          PRODUCT = "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/medical.html"
          OFFICIAL = "https://dpro-shop.com/"
          LINE = "https://lin.ee/YxJGXV6D"
          SYSTEM_CHECK = BASE + "/system-check.html"

          protected = [
            "medical-public-demo.html","medical-tutorial.js","index.html","member.html",
            "owner.html","owner-ipad.html","staff.html","system-check.html",
            "patient-reservation.html","patient-questionnaire.html","patient-reception.html",
            "patient-wait-status.html","patient-digital-card.html"
          ]
          def sha(path):
              p=ROOT/path
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          before={p:sha(p) for p in protected}

          # Approved existing DPRO MEDICAL clinic photos from Library baseline.
          (ASSET/"medical-industry-hero.jpg").write_bytes(base64.b64decode(""))
          (ASSET/"medical-consult.jpg").write_bytes(base64.b64decode(""))

          def qr(name,url):
              p=ASSET/f"qr-v11-{name}.png"
              qrcode.make(url).save(p)
              return f"assets/presentation/{p.name}"
          Q={
            "line":qr("line",LINE),
            "official":qr("official",OFFICIAL),
            "demo":qr("demo",DEMO),
            "guide":qr("guide",GUIDE),
            "system":qr("system",SYSTEM_CHECK),
          }

          first10=[
            ("01","30秒体験を開始","公開DEMOの30秒導線から全体像を確認します。"),
            ("02","患者スマホを開く","予約・WEB問診・当日受付・待ち状況の入口を確認します。"),
            ("03","医院管理PCを見る","予約・受付・待ち・診察中など全体の状態を確認します。"),
            ("04","6診療パターンを比較","STANDARD / EYE / PEDIATRIC / ORTHO / BEAUTY / WOMENを比較します。"),
            ("05","眼科PRESETへ切替","診療科ごとの表示・機能差分を確認します。"),
            ("06","患者画面の役割を確認","患者側に必要な操作だけが整理されていることを確認します。"),
            ("07","医院管理PCの役割を確認","医院全体の運用・進行を一画面で確認します。"),
            ("08","受付iPadの役割を確認","受付担当が必要な情報へ集中できることを確認します。"),
            ("09","スタッフ画面の役割を確認","院内進行と担当業務の見方を確認します。"),
            ("10","医院HPの公開境界を確認","公開情報と院内情報の境界を確認します。"),
          ]
          features=[
            ("予約","患者スマホから予約導線を整理"),
            ("WEB問診","来院前入力を医院運用へ接続"),
            ("来院受付","受付iPad・医院側で来院を確認"),
            ("院内進行","受付済・待ち・診察などを共有"),
            ("待ち状況","患者側でも現在状況を確認"),
            ("次回フォロー","診療後の次回導線まで接続"),
          ]

          def write(path, text):
              (ROOT/path).write_text(text,encoding="utf-8")

          # ---------- A4 FLYER MASTER V2.0 ----------
          feat=''.join(f'<article><b>{html.escape(t)}</b><span>{html.escape(c)}</span></article>' for t,c in features)
          a4='''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>DPRO MEDICAL A4 FLYER MASTER V2.0</title><style>
          @page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;background:#dfe8e5;font-family:"Noto Sans JP",sans-serif;color:#12342d}
          .page{width:210mm;height:297mm;margin:auto;background:#fff;overflow:hidden;position:relative}
          .hero{height:70mm;display:grid;grid-template-columns:1.25fr .75fr;background:#092b24;color:#fff}
          .hero .copy{padding:10mm 10mm 7mm}.brand{font-size:8pt;font-weight:900;letter-spacing:.08em;color:#30d6a0}.eyebrow{font-size:7pt;font-weight:900;letter-spacing:.12em;margin-top:6mm;color:#68e2bb}
          h1{font-size:22pt;line-height:1.08;margin:3mm 0 2.5mm}.hero p{font-size:8pt;line-height:1.55;margin:0;color:#dcece6}
          .hero img{width:100%;height:70mm;object-fit:cover;object-position:center}
          .body{padding:5mm 8mm 5mm}h2{font-size:12pt;margin:0 0 2.5mm}h2 em{font-style:normal;color:#0b9b6c}
          .features{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2mm}.features article{border:1px solid #d7e6e0;border-radius:3mm;padding:2.6mm;min-height:20mm;background:#fff}
          .features b{display:block;font-size:8.2pt}.features span{display:block;font-size:6.4pt;line-height:1.4;color:#536b63;margin-top:1mm}
          .connected{margin-top:3mm;background:#0b342c;color:#fff;border-radius:3.5mm;padding:3.2mm 4mm}.ctitle{font-size:6pt;color:#63dfb8;font-weight:900;letter-spacing:.09em}.connected h3{font-size:11pt;margin:1mm 0 2mm}
          .flow{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;align-items:center;gap:2mm}.flow div{background:#fff;color:#143b32;border-radius:2.5mm;padding:2.2mm;font-size:6.5pt;min-height:17mm}.flow b{display:block;font-size:7.5pt}.arrow{font-size:13pt;color:#72dfbd}
          .twins{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;margin-top:2.7mm}.twins article{border:1px solid #dbe8e3;border-radius:3mm;padding:2.8mm}.twins small{color:#0a9267;font-weight:900;font-size:6pt}.twins b{display:block;font-size:8pt;margin-top:1mm}.twins p{font-size:6.3pt;line-height:1.45;color:#5a6d66;margin:1mm 0 0}
          .price{display:grid;grid-template-columns:1.3fr .7fr;background:#0d7668;color:#fff;border-radius:3mm;margin-top:2.8mm;overflow:hidden}.price .left{padding:3mm 4mm}.price small{font-size:6pt;letter-spacing:.08em}.price strong{display:block;font-size:11pt;margin-top:1mm}.break{display:flex;gap:2mm;margin-top:2mm;font-size:6.2pt}.break span{background:rgba(255,255,255,.12);padding:1.3mm 2mm;border-radius:2mm}
          .total{display:grid;place-items:center;background:#0a6259;text-align:center}.total b{font-size:22pt}.total span{font-size:6.5pt}
          .cta-title{font-size:9pt;font-weight:900;margin:3mm 0 1.8mm}.qrs{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm}.qr{border:1px solid #d8e5e0;border-radius:2.8mm;padding:2mm;display:grid;grid-template-columns:22mm 1fr;align-items:center;gap:2mm}.qr img{width:22mm;height:22mm}.qr b{font-size:7.5pt}.qr span{display:block;font-size:5.7pt;color:#61736c;line-height:1.3;margin-top:1mm;word-break:break-all}
          footer{position:absolute;bottom:0;left:0;right:0;height:7mm;background:#082a23;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8mm;font-size:5.5pt}
          </style></head><body><main class="page">
          <section class="hero"><div class="copy"><div class="brand">DPRO LINE SYSTEMS</div><div class="eyebrow">MEDICAL / CLINIC</div><h1>予約だけじゃない。<br>来院前から来院後まで、<br>医院の流れをひとつに。</h1><p>予約・WEB問診・受付・院内進行・待ち状況・次回フォロー。患者スマホから医院管理PC・受付iPad・スタッフ・医院HPまでつなぎます。</p></div><img src="assets/presentation/medical-industry-hero.jpg" alt="クリニック受付"></section>
          <div class="body"><h2>医院の毎日を、<em>6つの仕組み</em>で整える。</h2><section class="features">{feat}</section>
          <section class="connected"><div class="ctitle">CONNECTED EXPERIENCE</div><h3>入口は自由。管理は、ひとつ。</h3><div class="flow"><div><b>ENTRANCE</b>LINE / WEB / 受付</div><span class="arrow">→</span><div><b>DPRO MEDICAL</b>予約・問診・受付・進行</div><span class="arrow">→</span><div><b>ONE MANAGEMENT HUB</b>医院管理PC / 受付iPad / Staff / HP</div></div></section>
          <div class="twins"><article><small>CUSTOM FIT</small><b>6診療パターンを共通基盤で。</b><p>STANDARD・眼科・小児科・整形外科・美容医療・婦人科/女性医療を、必要な機能に合わせて切り替えます。</p></article><article><small>LIVE SYNC</small><b>患者側と医院側が同じ流れでつながる。</b><p>予約・受付・待ち・診察進行など、必要な情報を役割ごとに見やすく共有します。</p></article></div>
          <section class="price"><div class="left"><small>MONTHLY COST CHECK</small><strong>LINE・ホームページ・DPROを、月額5,500円（税込）でまとめて運用。</strong><div class="break"><span>LINE公式運用 3,300円</span><span>ホームページ運用 1,100円</span><span>DPROシステム運用 1,100円</span></div></div><div class="total"><div><span>月額合計（税込）</span><b>5,500円</b><span>3つまとめて運用</span></div></div></section>
          <div class="cta-title">相談する。知る。試す。DPROを、もっと近くに。</div><section class="qrs">
          <article class="qr"><img src="{Q['line']}"><div><b>01 / LINE相談</b><span>{LINE}</span></div></article>
          <article class="qr"><img src="{Q['official']}"><div><b>02 / DPRO SHOP公式</b><span>{OFFICIAL}</span></div></article>
          <article class="qr"><img src="{Q['demo']}"><div><b>03 / LIVE DEMO</b><span>{DEMO}</span></div></article>
          </section></div><footer><b>DPRO LINE SYSTEMS / MEDICAL</b><span>DPRO A4 FLYER MASTER V2.0 / CONFORMANCE V1.1</span></footer></main></body></html>'''
          a4=(a4.replace("{feat}",feat)
                  .replace("{Q['line']}",Q['line'])
                  .replace("{Q['official']}",Q['official'])
                  .replace("{Q['demo']}",Q['demo'])
                  .replace("{LINE}",LINE)
                  .replace("{OFFICIAL}",OFFICIAL)
                  .replace("{DEMO}",DEMO))
          write("DPRO_MEDICAL_A4_FLYER_MASTER_V2.0.html",a4)

          # ---------- LP MASTER V1.4 P1-P10 ----------
          fcards=''.join(f'<article><b>{html.escape(t)}</b><p>{html.escape(c)}</p></article>' for t,c in features)
          lp='''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>DPRO MEDICAL｜医療機関向けDPRO</title><style>
          :root{--ink:#14364d;--muted:#5f7484;--blue:#1469a8;--red:#a51743;--navy:#0c2c43;--soft:#eef6fa;--line:#d8e5ec;--green:#138760}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#fff;overflow-x:hidden}.shell{width:min(1120px,calc(100% - 30px));margin:auto}.sec{padding:66px 0}.soft{background:var(--soft)}.dark{background:var(--navy);color:#fff}.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:6px 9px;font-size:11px;font-weight:900;letter-spacing:.06em}h1{font-size:clamp(38px,6vw,70px);line-height:1.06;margin:14px 0}h2{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:10px 0 18px}p{line-height:1.75}.lead{font-size:19px;color:#405e73;max-width:820px}.hero{background:linear-gradient(135deg,#edf7fb,#fff 60%,#fdf0f5)}.hero-grid,.cta-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:34px;align-items:center}.photo{width:100%;border-radius:22px;box-shadow:0 18px 45px #1233;max-height:430px;object-fit:cover}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:900;border:1px solid var(--line);background:#fff}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--line);border-radius:17px;padding:18px;background:#fff}.card b{font-size:17px}.card p{font-size:13px;color:var(--muted);margin:8px 0 0}.why{display:grid;grid-template-columns:1fr 1fr;gap:18px}.diagram{display:grid;grid-template-columns:1fr auto 1.1fr auto 1.2fr;gap:12px;align-items:center;margin-top:25px}.diagram article{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-height:130px}.diagram .arr{font-size:30px;color:var(--green)}.dark .diagram article{color:var(--ink)}.beforeafter{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}.before,.after{border-radius:18px;padding:20px}.before{background:#f5f5f5}.after{background:#effaf5;border:1px solid #bfe3d2}.price{display:grid;grid-template-columns:1.3fr .7fr;border-radius:22px;overflow:hidden;background:#0f796a;color:#fff}.price .pbody{padding:28px}.price .total{display:grid;place-items:center;background:#0b6258;text-align:center}.price .total b{font-size:50px}.break{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.break span{background:#ffffff1b;padding:9px 12px;border-radius:10px}.screen{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px}.screen img{width:100%;display:block;border-radius:10px}.cta{background:linear-gradient(135deg,#fff,#edf7fb)}.linebox{background:#0a9f47;color:#fff;border-radius:18px;padding:22px;text-align:center;font-size:24px;font-weight:900;text-decoration:none;display:block}@media(max-width:820px){.hero-grid,.cta-grid,.why,.beforeafter,.price{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.diagram{grid-template-columns:1fr}.diagram .arr{transform:rotate(90deg);text-align:center}}@media(max-width:520px){.sec{padding:46px 0}.grid3{grid-template-columns:1fr}.actions .btn{width:100%}}
          </style></head><body>
          <section class="sec hero" id="p1"><div class="shell hero-grid"><div><span class="tag">P1 FIRST VIEW</span><h1>予約だけで終わらない。<br>患者と医院の流れを、ひとつに。</h1><p class="lead">患者スマホの予約・WEB問診・来院受付から、医院管理PC・受付iPad・スタッフ・医院HP・次回フォローまで。6診療パターンを共通基盤でつなぎます。</p><div class="actions"><a class="btn primary" href="{DEMO}">LIVE DEMO</a><a class="btn" href="{LINE}">LINEで相談</a></div></div><img class="photo" src="assets/presentation/medical-industry-hero.jpg" alt="クリニック受付"></div></section>
          <section class="sec" id="p2"><div class="shell"><span class="tag">P2 OWNER PAIN</span><h2>こんなお悩みありませんか？</h2><div class="grid3"><article class="card"><b>電話対応が多い</b><p>予約・問い合わせで診療や受付が中断する。</p></article><article class="card"><b>情報が分散する</b><p>予約・問診・受付・院内進行が別々に管理される。</p></article><article class="card"><b>患者案内に手間がかかる</b><p>待ち状況や次回案内を個別に伝える負担がある。</p></article></div></div></section>
          <section class="sec soft" id="p3"><div class="shell"><span class="tag">P3 WHY PROBLEM</span><h2>なぜ、問題が起きるのか。</h2><div class="why"><article class="card"><b>入口がバラバラ</b><p>電話・WEB・LINE・受付で情報が分かれると、転記と確認が増えます。</p></article><article class="card"><b>役割ごとの画面がつながっていない</b><p>患者・受付・スタッフ・医院HPで同じ状態を見られないと、行き違いが起きます。</p></article></div></div></section>
          <section class="sec dark" id="p4"><div class="shell"><span class="tag">P4 CONNECTED SYSTEM</span><h2>入口は自由。管理は、ひとつ。</h2><div class="diagram"><article><b>ENTRANCE</b><p>LINE / WEB / 電話・窓口 / QR受付</p></article><div class="arr">→</div><article><b>DPRO MEDICAL</b><p>予約・問診・受付・待ち・院内進行</p></article><div class="arr">→</div><article><b>ONE MANAGEMENT HUB</b><p>医院管理PC / 受付iPad / Staff / 医院HP</p></article></div></div></section>
          <section class="sec" id="p5"><div class="shell"><span class="tag">P5 CUSTOMER EXPERIENCE</span><h2>患者さんは、来院前から迷いにくい。</h2><div class="grid3">{fcards}</div></div></section>
          <section class="sec soft" id="p6"><div class="shell"><span class="tag">P6 OWNER / STAFF EXPERIENCE</span><h2>医院側は、役割ごとに必要な情報へ。</h2><div class="grid3"><article class="card"><b>医院管理PC</b><p>全体の予約・受付・進行を確認。</p></article><article class="card"><b>受付iPad</b><p>受付業務に必要な情報へ集中。</p></article><article class="card"><b>スタッフ</b><p>院内進行と担当業務を確認。</p></article></div></div></section>
          <section class="sec" id="p7"><div class="shell"><span class="tag">P7 BEFORE / AFTER</span><h2>導入前と導入後。</h2><div class="beforeafter"><div class="before"><b>BEFORE</b><p>電話・紙・複数画面<br>転記と確認が多い<br>待ち状況の問い合わせ</p></div><div style="font-size:38px">→</div><div class="after"><b>AFTER</b><p>LINE / WEBから同じ流れへ<br>患者と医院で状態を共有<br>役割別画面で確認</p></div></div></div></section>
          <section class="sec dark" id="p8"><div class="shell"><span class="tag">P8 PRICE / VALUE</span><h2>3つまとめて月額5,500円（税込）。</h2><div class="price"><div class="pbody"><b>ホームページ + LINE公式 + DPROをまとめて運用</b><div class="break"><span>LINE公式運用 3,300円</span><span>ホームページ運用 1,100円</span><span>DPROシステム運用 1,100円</span></div><p>※DPRO単体の料金ではありません。契約条件・オプションはDPRO SHOPで確認してください。</p></div><div class="total"><div>月額合計<br><b>5,500円</b><br>税込</div></div></div></div></section>
          <section class="sec" id="p9"><div class="shell"><span class="tag">P9 DEMO</span><h2>実際のMEDICAL画面で確認。</h2><div class="screen"><img src="assets/presentation/medical-owner-screen.png" alt="DPRO MEDICAL 実画面"></div><div class="actions"><a class="btn primary" href="{DEMO}">公開LIVE DEMOを開く</a></div></div></section>
          <section class="sec cta" id="p10"><div class="shell cta-grid"><img class="photo" src="assets/presentation/medical-consult.jpg" alt="医療スタッフとの相談"><div><span class="tag">P10 CONSULT / CTA</span><h2>まずはLINEで、お気軽にご相談ください。</h2><p class="lead">導入のご相談・デモのご案内・料金のご質問まで、DPRO SHOPで確認できます。</p><a class="linebox" href="{LINE}">LINEで無料相談する</a></div></div></section>
          </body></html>'''
          lp=(lp.replace("{DEMO}",DEMO)
                  .replace("{LINE}",LINE)
                  .replace("{fcards}",fcards))
          write("lp.html",lp)

          # ---------- GUIDE CENTER ----------
