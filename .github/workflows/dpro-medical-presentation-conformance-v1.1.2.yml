                  for w in [375,390,430,768,1280,1440]:
                      p=br.new_page(viewport={"width":w,"height":900})
                      p.goto(f"http://127.0.0.1:8765/{f}",wait_until="domcontentloaded",timeout=15000)
                      sw=p.evaluate("document.documentElement.scrollWidth"); cw=p.evaluate("document.documentElement.clientWidth")
                      ok=sw<=cw+1; responsive[f][str(w)]={"scrollWidth":sw,"clientWidth":cw,"pass":ok}
                      if not ok: errors.append(f"OVERFLOW_{f}_{w}")
                      p.close()
              br.close()

          # All browser-based local QA is now complete.
          srv.shutdown()

          # Final PDF QR decoding from rendered pixels (A4 must decode all 3 formal routes).
          qr_decoded=[]
          subprocess.run(["pdftoppm","-png","-r","220","-f","1","-singlefile",str(ROOT/"DPRO_MEDICAL_A4_FLYER_MASTER_V2.0.pdf"),"/tmp/a4qr"],check=True)
          from PIL import Image
          from pyzbar.pyzbar import decode
          for d in decode(Image.open("/tmp/a4qr.png")):
              try: qr_decoded.append(d.data.decode("utf-8"))
              except: pass
          for u in [LINE,OFFICIAL,DEMO]:
              need("A4_FINAL_PDF_QR_"+u, u in qr_decoded)

          # Core protection.
          after={p:sha(p) for p in protected}
          core={p:{"before":before[p],"after":after[p],"pass":before[p]==after[p]} for p in protected}
          for p,v in core.items():
              if not v["pass"]: errors.append("CORE_CHANGED_"+p)

          report={
            "standard":"DPRO MEDICAL PRESENTATION CONFORMANCE V1.1.2",
            "masters":{"A4":"DPRO A4 FLYER MASTER V2.0","LP":"DPRO-LP-MASTER-V1.4","Tutorial":"DPRO TUTORIAL STANDARD V1.1"},
            "checks":checks,"pages":pages,"responsive":responsive,"qr_decoded":qr_decoded,
            "protected_core":core,"pass":not errors,"errors":errors
          }
          write("DPRO_MEDICAL_PRESENTATION_QA_REPORT_V1.1.json",json.dumps(report,ensure_ascii=False,indent=2))
          write("DPRO_MEDICAL_PRESENTATION_QA_REPORT_V1.1.md",
                "# DPRO MEDICAL PRESENTATION CONFORMANCE V1.1.2\n\n"
                + ("**PASS**" if not errors else "**FAIL**")
                + "\n\nErrors: "+(", ".join(errors) if errors else "none")+"\n")
          if errors:
              print(json.dumps(report,ensure_ascii=False,indent=2))
              raise SystemExit("Presentation conformance V1.1 QA failed")
          print(json.dumps({"pass":True,"checks":len(checks),"qr_decoded":qr_decoded},ensure_ascii=False))
          PY
          python /tmp/medical_v11.py

