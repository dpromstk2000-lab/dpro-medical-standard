name: DPRO MEDICAL TUTORIAL R3-R4 V1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-tutorial-r3-r4-v1.yml"

permissions:
  contents: write

env:
  LIVE_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html
  LIVE_JS_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-tutorial.js

jobs:
  tutorial-r3-r4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record pre-R3 source lock
        shell: bash
        run: |
          echo "PRE_R3_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRE_R3_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "Newest main checked out: $(git rev-parse HEAD)"
          test -f medical-public-demo.html
          if git log -1 --pretty=%B | grep -qiE 'revert|rollback'; then
            echo "NOTICE: latest commit message contains revert/rollback wording; continuing forward-only without resetting history."
          fi

      - name: Apply R3 Tutorial runtime
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          r3 = """""".replace("\n", "")
          Path("medical-tutorial.js").write_bytes(base64.b64decode(r3))
          p=Path("medical-public-demo.html")
          text=p.read_text(encoding="utf-8")
          loader='<script id="dpro-medical-tutorial-loader">(function(){var s=document.createElement("script");s.src="medical-tutorial.js?v="+Date.now();s.async=true;document.body.appendChild(s);})();</script>'
          if 'id="dpro-medical-tutorial-loader"' not in text:
              if '</body>' not in text:
                  raise SystemExit('R3 HOLD: </body> insertion point missing')
              text=text.replace('</body>', loader+'\n</body>', 1)
          if text.count('id="dpro-medical-tutorial-loader"') != 1:
              raise SystemExit('R3 HOLD: Tutorial loader count is not 1')
          p.write_text(text,encoding="utf-8")
          js=Path("medical-tutorial.js").read_text(encoding="utf-8")
          assert js.count("id:'medical-first10-") == 10
          assert 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R3' in js
          assert "fetch(" not in js and "XMLHttpRequest" not in js
          print('R3 static contract PASS')
          PY2
          node --check medical-tutorial.js

      - name: Commit R3 implementation forward-only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medical-public-demo.html medical-tutorial.js
          if git diff --cached --quiet; then
            echo "R3 implementation already present."
          else
            git commit -m "DPRO MEDICAL Tutorial R3 implementation"
            git push
          fi
          echo "R3_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R3_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for R3 public LIVE
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 48); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_JS_URL?qa=$(date +%s%N)" -o /tmp/live-r3.js && grep -q 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R3' /tmp/live-r3.js; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = "1" || { echo "R3 HOLD: public LIVE marker not updated"; exit 1; }

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare R3 LIVE QA
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          q = """""".replace("\n", "")
          Path("qa-r3.mjs").write_bytes(base64.b64decode(q))
          PY2
          node --check qa-r3.mjs

      - name: R3 exact four-width public LIVE QA
        shell: bash
        run: |
          node qa-r3.mjs
          cp tutorial-qa-results.json R3_QA_EVIDENCE.json
          python3 - <<'PY2'
          import json
          x=json.load(open('R3_QA_EVIDENCE.json',encoding='utf-8'))
          assert x['pass'] is True
          assert x['global']['BUSINESS_MUTATION'] == 0
          print('R3 FULL PASS')
          PY2

      - name: Apply R4 Guide Center only after R3 PASS
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          r4 = """""".replace("\n", "")
          Path("medical-tutorial.js").write_bytes(base64.b64decode(r4))
          js=Path("medical-tutorial.js").read_text(encoding="utf-8")
          assert js.count("id:'medical-first10-") == 10
          assert 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R4' in js
          assert 'DPRO MEDICAL GUIDE CENTER STANDARD V1.1 / R4' in js
          assert "fetch(" not in js and "XMLHttpRequest" not in js
          print('R4 static alignment PASS')
          PY2
          node --check medical-tutorial.js

      - name: Commit R4 Guide Center forward-only
        shell: bash
        run: |
          git add medical-tutorial.js
          git commit -m "DPRO MEDICAL Tutorial R4 Guide Center"
          git push
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R4_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for R4 public LIVE
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 48); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_JS_URL?qa=$(date +%s%N)" -o /tmp/live-r4.js && grep -q 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R4' /tmp/live-r4.js && grep -q 'DPRO MEDICAL GUIDE CENTER STANDARD V1.1 / R4' /tmp/live-r4.js; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = "1" || { echo "R4 HOLD: public LIVE marker not updated"; exit 1; }

      - name: Prepare R4 LIVE QA
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          q = """""".replace("\n", "")
          Path("qa-r4.mjs").write_bytes(base64.b64decode(q))
          PY2
          node --check qa-r4.mjs

      - name: R4 exact four-width public LIVE QA
        shell: bash
        run: |
          node qa-r4.mjs
          cp r4-qa-results.json R4_QA_EVIDENCE.json
          python3 - <<'PY2'
          import json
          x=json.load(open('R4_QA_EVIDENCE.json',encoding='utf-8'))
          assert x['pass'] is True
          assert x['global']['GUIDE_COUNT'] == 10
          assert x['global']['FIRST10_COUNT'] == 10
          assert x['global']['BUSINESS_MUTATION'] == 0
          print('R4 FULL PASS')
          PY2

      - name: Remove temporary workflow after R4 PASS
        shell: bash
        run: |
          git rm .github/workflows/dpro-medical-tutorial-r3-r4-v1.yml
          git commit -m "Remove temporary MEDICAL R3-R4 workflow [skip ci]"
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Build R4 CENTRAL RETURN ZIP
        shell: bash
        run: |
          mkdir -p central_return
          cat > central_return/00_START_HERE.txt <<EOF2
          DPRO TUTORIAL BATCH-10 / MEDICAL / R4 CENTRAL RETURN
          VERSION V1.0 / 2026-08-30 JST
          R2_CENTRAL=ACCEPTED
          R3=PASS
          R4=PASS
          FIRST10_COUNT=10
          GUIDE_COUNT=10
          BUSINESS_MUTATION=0
          FORWARD_ONLY=PASS
          R5=NOT_STARTED_NOT_AUTHORIZED
          R6=NOT_STARTED_NOT_AUTHORIZED
          R7=NOT_AUTHORIZED_NOT_EXECUTED
          FINAL_LOCK=CENTRAL_DECISION_ONLY
          EOF2
          sed -i 's/^          //' central_return/00_START_HERE.txt

          cat > central_return/STATUS.txt <<EOF2
          SYSTEM=MEDICAL
          BATCH=10
          R2_CENTRAL=ACCEPTED
          R3=PASS
          R4=PASS
          FIRST10_COUNT=10
          GUIDE_COUNT=10
          GUIDE_TUTORIAL_ALIGNMENT=PASS
          BUSINESS_MUTATION=0
          FORWARD_ONLY=PASS
          R5=NOT_STARTED_NOT_AUTHORIZED
          R6=NOT_STARTED_NOT_AUTHORIZED
          R7=NOT_AUTHORIZED_NOT_EXECUTED
          FINAL_LOCK=CENTRAL_DECISION_ONLY
          EOF2
          sed -i 's/^          //' central_return/STATUS.txt

          cat > central_return/SOURCE_LOCK_R4.txt <<EOF2
          REPOSITORY=https://github.com/dpromstk2000-lab/dpro-medical-standard
          R2_ACCEPTED_HEAD=7753ed489e991c12f73b8a217ac070375f59f4af
          PRE_R3_HEAD=$PRE_R3_HEAD
          PRE_R3_TREE=$PRE_R3_TREE
          R3_HEAD=$R3_HEAD
          R3_TREE=$R3_TREE
          R4_HEAD=$R4_HEAD
          R4_TREE=$R4_TREE
          FINAL_HEAD=$FINAL_HEAD
          FINAL_TREE=$FINAL_TREE
          FORWARD_ONLY=PASS
          RESET_REVERT_FORCE_PUSH=0
          EOF2
          sed -i 's/^          //' central_return/SOURCE_LOCK_R4.txt

          cat > central_return/R2_ACCEPTED_CONTRACT.txt <<'EOF2'
          R2_CENTRAL=ACCEPTED
          FIRST10_COUNT=10
          FIRST10_UNIQUE_IDS=10
          ROUTE=/medical-public-demo.html
          SAFE_QUERY_PARAMETERS=NONE
          CROSS_PAGE=NO
          BUSINESS_MUTATION_DESIGN=0
          Accepted First10 IDs/orders/selectors/fallbacks preserved exactly from R2 CENTRAL acceptance.
          EOF2
          sed -i 's/^          //' central_return/R2_ACCEPTED_CONTRACT.txt

          cat > central_return/R3_CHANGED_FILES.txt <<'EOF2'
          medical-public-demo.html
          medical-tutorial.js
          R3 changes are Tutorial-only: loader + Tutorial runtime. No Worker/Supabase/DB/API/Auth/Role/Permission/Feature Flag/Product Site change.
          EOF2
          sed -i 's/^          //' central_return/R3_CHANGED_FILES.txt

          cp R3_QA_EVIDENCE.json central_return/R3_QA_EVIDENCE.json

          cat > central_return/R4_CHANGED_FILES.txt <<'EOF2'
          medical-tutorial.js
          R4 change adds Guide Center view over the same First10 array and same Tutorial state/storage. No second Tutorial state machine.
          EOF2
          sed -i 's/^          //' central_return/R4_CHANGED_FILES.txt

          cp R4_QA_EVIDENCE.json central_return/R4_QA_EVIDENCE.json

          cat > central_return/PROTECTED_BOUNDARIES.txt <<'EOF2'
          Worker change=0
          Supabase/DB change=0
          API contract change=0
          Auth change=0
          Role/Permission change=0
          Feature Flag change=0
          Product Site change=0
          Real patient/health/appointment/queue/visit/treatment data used=0
          Unsafe write request during Tutorial/Guide QA=0
          Business mutation=0
          BRUSHUP-7/8/9/10 reopened=0
          BRUSHUP-6 external LINE HOLD unchanged/separate
          EOF2
          sed -i 's/^          //' central_return/PROTECTED_BOUNDARIES.txt

          cat > central_return/NEXT_ACTION.txt <<'EOF2'
          1. Download DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip from this workflow artifact.
          2. Upload that ZIP to DPRO TUTORIAL CENTRAL.
          3. STOP in MEDICAL child chat.
          4. Do not start R5/R6/R7. FINAL LOCK is CENTRAL decision only.
          EOF2
          sed -i 's/^          //' central_return/NEXT_ACTION.txt

          (cd central_return && sha256sum 00_START_HERE.txt STATUS.txt SOURCE_LOCK_R4.txt R2_ACCEPTED_CONTRACT.txt R3_CHANGED_FILES.txt R3_QA_EVIDENCE.json R4_CHANGED_FILES.txt R4_QA_EVIDENCE.json PROTECTED_BOUNDARIES.txt NEXT_ACTION.txt > SHA256.txt)
          (cd central_return && zip -q -j ../DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip ./*)
          unzip -l DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip

      - name: Upload CENTRAL RETURN artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830
          path: DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R3-R4_QA_EVIDENCE_V1.0_20260830
          path: |
            R3_QA_EVIDENCE.json
            R4_QA_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
