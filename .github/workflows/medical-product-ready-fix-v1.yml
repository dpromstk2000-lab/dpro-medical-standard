name: DPRO MEDICAL PRODUCT READY FIX V1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medical-product-ready-fix-v1.yml'

permissions:
  contents: write

jobs:
  ready-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply MEDICAL READY minimal fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          FRONTEND_VERSION = "MEDICAL-READY-V1.1-PAGES-20260821"

          def load(name):
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f"Required file missing: {name}")
              return p, p.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Replacement target count invalid: {label} count={count}")
              return text.replace(old, new, 1)

          p, s = load("medical-public-demo.html")
          if "DPRO MEDICAL CORE Worker" in s:
              s = replace_once(
                  s,
                  '<strong id="apiText">DPRO MEDICAL CORE Worker 接続確認中</strong><small>公開health endpointのみを確認。DEMO操作は架空データで、本番書込みは行いません。</small>',
                  '<strong id="apiText">共通基盤を確認中</strong><small>公開DEMOの接続状態を確認しています。体験操作は架空データのみを使用します。</small>',
                  "public demo card copy"
              )
              s = replace_once(
                  s,
                  'text.textContent="DPRO MEDICAL CORE Worker 公開health応答あり";',
                  'text.textContent="共通基盤：接続確認済み";',
                  "public demo success copy"
              )
              s = replace_once(
                  s,
                  'text.textContent="DPRO MEDICAL CORE Worker：ブラウザから接続確認待ち";',
                  'text.textContent="共通基盤：接続確認待ち";',
                  "public demo waiting copy"
              )
          p.write_text(s, encoding="utf-8")

          p, s = load("config.js")
          if 'frontendVersion:' not in s:
              s = replace_once(
                  s,
                  '  integrationVersion: "INTEGRATION-1 STANDARD V1.3",\n',
                  f'  integrationVersion: "INTEGRATION-1 STANDARD V1.3",\n  frontendVersion: "{FRONTEND_VERSION}",\n',
                  "frontend version insert"
              )
          else:
              s, n = re.subn(
                  r'(\s*frontendVersion:\s*)"[^"]*"',
                  rf'\1"{FRONTEND_VERSION}"',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("frontendVersion update failed")
          p.write_text(s, encoding="utf-8")

          p, s = load("patient-reservation.html")

          if 'value="2026-08-18"' in s:
              s = replace_once(
                  s,
                  '<input id="appointmentDate" type="date" value="2026-08-18">',
                  '<input id="appointmentDate" type="date">',
                  "remove stale fixed date"
              )

          marker = 'function source(){return new URLSearchParams(location.search).get("source")==="line"?"line":"web";}'
          if 'function todayJst()' not in s:
              s = replace_once(
                  s,
                  marker,
                  marker + '\n'
                  'function todayJst(){return new Date(Date.now()+9*60*60*1000).toISOString().slice(0,10);}\n'
                  'function tomorrowJst(){return new Date(Date.now()+9*60*60*1000+86400000).toISOString().slice(0,10);}\n'
                  'function isFutureSlot(slot){const t=Date.parse(slot?.start_at||"");return Number.isFinite(t)&&t>Date.now();}',
                  "reservation helpers"
              )

          if 'const requestedDate=$("appointmentDate").value;' not in s:
              old = 'async function loadSlots(){clearError();selectedSlot=null;$("appointmentSlot").innerHTML=\'<option value="">読み込み中...</option>\';try{const r=await api.getAppointmentSlots({date:$("appointmentDate").value,appointment_type_id:$("appointmentType").value});slots=(r.data||[]).filter(s=>s.available!==false&&s.appointment_slot_id);'
              new = 'async function loadSlots(){clearError();selectedSlot=null;const requestedDate=$("appointmentDate").value;if(!requestedDate||requestedDate<todayJst()){showError("過去の日付は予約できません。今日以降の日付を選択してください。");$("appointmentSlot").innerHTML=\'<option value="">選択できません</option>\';return;}$("appointmentSlot").innerHTML=\'<option value="">読み込み中...</option>\';try{const r=await api.getAppointmentSlots({date:requestedDate,appointment_type_id:$("appointmentType").value});slots=(r.data||[]).filter(s=>s.available!==false&&s.appointment_slot_id&&isFutureSlot(s));'
              s = replace_once(s, old, new, "past date/slot filter")

          old_confirm = 'if(!selectedType||!selectedSlot){showError("予約種別と空き枠を選択してください。");return;}'
          guard_confirm = 'if(!selectedType||!selectedSlot){showError("予約種別と空き枠を選択してください。");return;}if(!isFutureSlot(selectedSlot)){showError("過去の時間は予約できません。空き枠を再取得してください。");return;}'
          if guard_confirm not in s:
              s = replace_once(s, old_confirm, guard_confirm, "confirm guard")

          old_create = 'if(!selectedType||!selectedSlot){showError("予約内容をもう一度確認してください。");return;}submitting=true;'
          guard_create = 'if(!selectedType||!selectedSlot){showError("予約内容をもう一度確認してください。");return;}if(!isFutureSlot(selectedSlot)){showError("この予約枠はすでに過ぎています。空き枠を再取得してください。");return;}submitting=true;'
          if guard_create not in s:
              s = replace_once(s, old_create, guard_create, "create guard")

          old_boot = 'try{const runtime=await DPRO_MEDICAL_PATIENT_API.prepareRuntime();'
          new_boot = 'try{const dateInput=$("appointmentDate");const minDate=todayJst();dateInput.min=minDate;if(!dateInput.value||dateInput.value<minDate)dateInput.value=minDate;const runtime=await DPRO_MEDICAL_PATIENT_API.prepareRuntime();if(runtime==="demo_mock")dateInput.value=tomorrowJst();'
          if 'dateInput.min=minDate' not in s:
              s = replace_once(s, old_boot, new_boot, "date input initialization")

          p.write_text(s, encoding="utf-8")

          p, s = load("patient-mock-data.js")
          if 'const DEMO_DATE_1=' not in s:
              marker = '"use strict";\nconst M={'
              inject = (
                  '"use strict";\n'
                  'const demoDate=(offset)=>new Date(Date.now()+9*60*60*1000+offset*86400000).toISOString().slice(0,10);\n'
                  'const demoAt=(date,time)=>`${date}T${time}:00+09:00`;\n'
                  'const DEMO_DATE_1=demoDate(1),DEMO_DATE_2=demoDate(2);\n'
                  'const M={'
              )
              s = replace_once(s, marker, inject, "dynamic demo dates")

          replacements = [
              ('appointment_date:"2026-08-18",start_at:"2026-08-18T09:00:00+09:00",end_at:"2026-08-18T09:30:00+09:00"',
               'appointment_date:DEMO_DATE_1,start_at:demoAt(DEMO_DATE_1,"09:00"),end_at:demoAt(DEMO_DATE_1,"09:30")'),
              ('appointment_date:"2026-08-18",start_at:"2026-08-18T09:30:00+09:00",end_at:"2026-08-18T10:00:00+09:00"',
               'appointment_date:DEMO_DATE_1,start_at:demoAt(DEMO_DATE_1,"09:30"),end_at:demoAt(DEMO_DATE_1,"10:00")'),
              ('appointment_date:"2026-08-18",start_at:"2026-08-18T10:00:00+09:00",end_at:"2026-08-18T11:00:00+09:00"',
               'appointment_date:DEMO_DATE_1,start_at:demoAt(DEMO_DATE_1,"10:00"),end_at:demoAt(DEMO_DATE_1,"11:00")'),
              ('appointment_date:"2026-08-19",start_at:"2026-08-19T09:30:00+09:00",end_at:"2026-08-19T10:00:00+09:00"',
               'appointment_date:DEMO_DATE_2,start_at:demoAt(DEMO_DATE_2,"09:30"),end_at:demoAt(DEMO_DATE_2,"10:00")'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          p.write_text(s, encoding="utf-8")

          demo = Path("medical-public-demo.html").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")
          reserve = Path("patient-reservation.html").read_text(encoding="utf-8")
          mock = Path("patient-mock-data.js").read_text(encoding="utf-8")

          checks = {
              "customer wording": "DPRO MEDICAL CORE Worker" not in demo and "公開health endpoint" not in demo,
              "frontend version": FRONTEND_VERSION in config,
              "stale reservation date removed": 'value="2026-08-18"' not in reserve,
              "min date": "dateInput.min=minDate" in reserve,
              "past date guard": 'requestedDate<todayJst()' in reserve,
              "future slot filter": 'isFutureSlot(s)' in reserve,
              "confirm guard": '過去の時間は予約できません' in reserve,
              "create guard": 'この予約枠はすでに過ぎています' in reserve,
              "demo defaults tomorrow": 'runtime==="demo_mock")dateInput.value=tomorrowJst()' in reserve,
              "dynamic mock dates": "DEMO_DATE_1=demoDate(1)" in mock,
              "stale mock datetimes removed": "2026-08-18T09:" not in mock and "2026-08-19T09:" not in mock,
              "system identity retained": "DPRO MEDICAL" in demo and "DPRO MEDICAL" in config,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"[{'PASS' if ok else 'FAIL'}] {name}")
          if failed:
              raise SystemExit("QA failed: " + ", ".join(failed))
          print(f"TOTAL: {len(checks)}/{len(checks)} PASS")
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check config.js
          node --check patient-mock-data.js

      - name: Commit READY fixes and self-remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/medical-product-ready-fix-v1.yml
          git config user.name "dpro-ready-bot"
          git config user.email "dpro-ready-bot@users.noreply.github.com"
          git add medical-public-demo.html config.js patient-reservation.html patient-mock-data.js .github/workflows/medical-product-ready-fix-v1.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "MEDICAL PRODUCT READY V1.1 customer copy and reservation guard"
          git push origin HEAD:main
