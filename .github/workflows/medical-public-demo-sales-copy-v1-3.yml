name: DPRO MEDICAL PUBLIC DEMO SALES COPY V1.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medical-public-demo-sales-copy-v1-3.yml'

permissions:
  contents: write

jobs:
  sales-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply complete customer-facing Japanese copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("medical-public-demo.html")
          s = p.read_text(encoding="utf-8")

          replacements = [
              ("DPRO MEDICAL｜公開LIVE DEMO｜6診療PRESET・5画面を30秒体験",
               "DPRO MEDICAL｜公開LIVE DEMO｜6診療科モデル・5画面を30秒体験"),
              ("6PRESETと5つの利用画面", "6診療科モデルと5つの利用画面"),
              ("DPRO MEDICAL PUBLIC LIVE DEMO V1.1", "DPRO MEDICAL 公開LIVE DEMO V1.3"),
              ("患者側と医院側を同じCOREでつなぎ", "患者側と医院側をひとつの共通基盤でつなぎ"),
              ("<strong>6 PRESET</strong>", "<strong>6 診療科モデル</strong>"),
              ("<strong>5 EXPERIENCE</strong>", "<strong>5 利用画面</strong>"),
              ("<strong>ONE CORE</strong>", "<strong>共通基盤</strong>"),
              (">6PRESETを比較する<", ">6診療科モデルを比較する<"),
              (">PRODUCT SITEで詳しく見る ↗<", ">製品サイトで詳しく見る ↗<"),
              (">OFFICIAL SITEで導入を見る ↗<", ">公式サイトで導入を見る ↗<"),
              ("診療科PRESETを変更", "診療科モデルを変更"),
              ("同じCOREの差分を比較", "診療科ごとの違いを比較"),
              (">6PRESETを比較<", ">6診療科モデルを比較<"),
              (">6PRESETの違いを一目で比較<", ">6診療科モデルの違いを一目で比較<"),
              ("<strong>共通COREは同じ。</strong>", "<strong>共通基盤は同じ。</strong>"),
              ("<strong>全PRESET共通</strong>", "<strong>全診療科モデル共通</strong>"),
              ("診療科の違いはPRESETで吸収し", "診療科の違いは設定で切り替え"),
              (">② 6診療科をONE COREで<", ">② 6診療科をひとつの基盤で<"),
              (">詳しい機能をPRODUCT SITEで見る ↗<", ">詳しい機能を製品サイトで見る ↗<"),
              (">導入・相談をOFFICIAL SITEで見る ↗<", ">導入・相談を公式サイトで見る ↗<"),
              ("PRESET差分を見てください", "診療科モデルの違いを見てください"),
              ("診療科PRESETの違いまで確認できました", "診療科モデルの違いまで確認できました"),
              (">PRESETを比較<", ">診療科モデルを比較<"),
              ("上のPRESET・利用画面を切り替えて比較できます", "上の診療科モデル・利用画面を切り替えて比較できます"),
              ("DPRO MEDICAL PUBLIC DEMO RELEASE V1.1 / 3-SITE NAV HOTFIX / ONE CORE · ONE CONTRACT · MULTI PRESET",
               "DPRO MEDICAL 公開LIVE DEMO V1.3 / 共通基盤・診療科別設定・安全な公開DEMO"),
          ]

          for old, new in replacements:
              s = s.replace(old, new)

          # Visible customer-facing strings that must be gone.
          forbidden = [
              "同じCORE",
              "6 PRESET",
              "5 EXPERIENCE",
              "ONE CORE",
              "ONE CONTRACT",
              "MULTI PRESET",
              "6PRESETを比較",
              "6PRESETの違い",
              "診療科PRESETを変更",
              "共通COREは同じ",
              "全PRESET共通",
              "PRODUCT SITEで",
              "OFFICIAL SITEで",
              "PRESET差分",
              "診療科PRESETの違い",
              "上のPRESET・利用画面",
          ]
          remaining = [x for x in forbidden if x in s]
          if remaining:
              raise SystemExit("Visible jargon remains: " + ", ".join(remaining))

          required = [
              "6 診療科モデル",
              "5 利用画面",
              "共通基盤",
              "製品サイトで詳しく見る",
              "公式サイトで導入を見る",
              "6診療科モデルの違いを一目で比較",
              "DPRO MEDICAL 公開LIVE DEMO V1.3 / 共通基盤・診療科別設定・安全な公開DEMO",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Required sales copy missing: " + ", ".join(missing))

          p.write_text(s, encoding="utf-8")
          print("SALES COPY V1.3 QA: PASS")
          print(f"CHECKS: {len(required)+len(forbidden)}")
          PY

      - name: Commit and remove old workflow files
        shell: bash
        run: |
          rm -f .github/workflows/medical-public-demo-sales-copy-v1-2.yml
          rm -f .github/workflows/medical-public-demo-sales-copy-v1-3.yml
          git config user.name "dpro-ready-bot"
          git config user.email "dpro-ready-bot@users.noreply.github.com"
          git add medical-public-demo.html .github/workflows/
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "MEDICAL public demo customer copy V1.3"
          git push origin HEAD:main
