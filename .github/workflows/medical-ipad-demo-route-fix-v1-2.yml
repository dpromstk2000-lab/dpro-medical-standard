name: DPRO MEDICAL IPAD DEMO ROUTE FIX V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medical-ipad-demo-route-fix-v1-2.yml'

permissions:
  contents: write

jobs:
  fix-ipad-demo-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add safe demo route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("clinic-runtime-config.js")
          s = p.read_text(encoding="utf-8")

          demo_line = "    'owner-ipad-demo.html': Object.freeze({ requiredPermissions: Object.freeze(['system_check.execute']) }),"

          if "'owner-ipad-demo.html'" not in s:
              pattern = r"(^\s*'owner-ipad\.html': Object\.freeze\(\{ requiredPermissions: Object\.freeze\(\['system_check\.execute'\]\) \}\),\s*$)"
              m = re.search(pattern, s, flags=re.MULTILINE)
              if not m:
                  raise SystemExit("owner-ipad.html policy line not found; stop without changes.")
              s = s[:m.end()] + "\n" + demo_line + s[m.end():]
              p.write_text(s, encoding="utf-8")
          else:
              print("owner-ipad-demo.html policy already present.")

          s = p.read_text(encoding="utf-8")
          checks = {
              "demo route exactly once": s.count("'owner-ipad-demo.html'") == 1,
              "owner route retained": "'owner.html'" in s,
              "owner ipad route retained": "'owner-ipad.html'" in s,
              "staff route retained": "'staff.html'" in s,
              "unknown route guard retained": "unknown canonical page route" in s,
              "production mock guard retained": "production guard: mock/mockMode is forbidden in production" in s,
              "API auth retained": "await auth.requireActor('staff'" in s,
              "mock branch retained": "if (mockMode)" in s,
              "mock data loader retained": "clinic-mock-data.js" in s,
          }
          for name, ok in checks.items():
              print(f"[{'PASS' if ok else 'FAIL'}] {name}")
          if not all(checks.values()):
              raise SystemExit("Safety QA failed.")
          print(f"TOTAL: {len(checks)}/{len(checks)} PASS")
          PY

      - name: JavaScript syntax check
        run: node --check clinic-runtime-config.js

      - name: Commit and remove old workflows
        shell: bash
        run: |
          rm -f .github/workflows/medical-ipad-demo-route-fix-v1-1.yml
          rm -f .github/workflows/medical-ipad-demo-route-fix-v1-2.yml
          git config user.name "dpro-ready-bot"
          git config user.email "dpro-ready-bot@users.noreply.github.com"
          git add -- clinic-runtime-config.js .github/workflows/medical-ipad-demo-route-fix-v1-1.yml .github/workflows/medical-ipad-demo-route-fix-v1-2.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "MEDICAL allow safe iPad demo route V1.2"
          git push origin HEAD:main
