name: DPRO MEDICAL PUBLIC DEMO V1.1 NAV HOTFIX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-public-demo-v1.1-nav-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add 3-site navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("medical-public-demo.html")
          text = p.read_text(encoding="utf-8")

          product_url = "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/medical.html"
          official_url = "https://dpro-shop.com/systems/medical"

          top_anchor = '    <a class="hero-btn" href="#presets">6PRESETを比較する</a>'
          top_insert = (
              '    <a class="hero-btn" href="#presets">6PRESETを比較する</a>\n'
              '    <a class="hero-btn" href="' + product_url + '" target="_blank" rel="noopener">PRODUCT SITEで詳しく見る ↗</a>\n'
              '    <a class="hero-btn" href="' + official_url + '" target="_blank" rel="noopener">OFFICIAL SITEで導入を見る ↗</a>'
          )

          if product_url not in text or official_url not in text:
              if top_anchor not in text:
                  raise SystemExit("QA FAILED: top hero action insertion point not found")
              text = text.replace(top_anchor, top_insert, 1)

          bottom_anchor = '<div class="foot">DPRO MEDICAL PUBLIC DEMO RELEASE V1.1 / ONE CORE · ONE CONTRACT · MULTI PRESET</div>'
          bottom_insert = (
              '<div class="hero-actions" aria-label="DEMO体験後の次の導線">\n'
              '  <a class="hero-btn" href="' + product_url + '" target="_blank" rel="noopener">詳しい機能をPRODUCT SITEで見る ↗</a>\n'
              '  <a class="hero-btn primary" href="' + official_url + '" target="_blank" rel="noopener">導入・相談をOFFICIAL SITEで見る ↗</a>\n'
              '</div>\n'
              '<div class="foot">DPRO MEDICAL PUBLIC DEMO RELEASE V1.1 / 3-SITE NAV HOTFIX / ONE CORE · ONE CONTRACT · MULTI PRESET</div>'
          )

          if "3-SITE NAV HOTFIX" not in text:
              if bottom_anchor not in text:
                  raise SystemExit("QA FAILED: bottom navigation insertion point not found")
              text = text.replace(bottom_anchor, bottom_insert, 1)

          p.write_text(text, encoding="utf-8")

          check = p.read_text(encoding="utf-8")
          assert "DPRO MEDICAL PUBLIC DEMO RELEASE V1.1" in check
          assert product_url in check
          assert official_url in check
          assert check.count(product_url) >= 2
          assert check.count(official_url) >= 2
          assert "3-SITE NAV HOTFIX" in check
          assert "おすすめ30秒体験を開始" in check
          assert "6PRESETの違いを一目で比較" in check
          assert "5つの画面を切り替えて体験" in check

          print("QA PASS: PUBLIC DEMO V1.1 3-SITE NAV HOTFIX")
          PY

      - name: Commit navigation hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medical-public-demo.html
          git commit -m "DPRO MEDICAL PUBLIC DEMO V1.1 3-site nav hotfix"
          git push
