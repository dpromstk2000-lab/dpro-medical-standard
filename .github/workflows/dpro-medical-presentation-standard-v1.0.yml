              if not ok: qa['pass']=False; qa['errors'].append(f'{p}: expected {n} pages, got {count}')

          # Keep legacy PDF links valid with corrected content.
          shutil.copy2(ROOT/'DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.1.pdf', ROOT/'DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.0.pdf')
          shutil.copy2(ROOT/'DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.1.pdf', ROOT/'DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.0.pdf')

          # Visual proof PNGs (first / all pages at modest resolution)
          for pdf in expected_pages:
              stem=Path(pdf).stem
              prefix=ASSET/f'qa-{stem}'
              subprocess.run(['pdftoppm','-png','-r','100',str(ROOT/pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          # Structural LP checks.
          lp_text=(ROOT/'lp.html').read_text(encoding='utf-8')
          for i in range(1,11):
              token=f'id="p{i}"'
              ok=token in lp_text
              qa['files'][f'LP_P{i}']=ok
              if not ok: qa['pass']=False; qa['errors'].append(f'LP missing P{i}')
          qa['files']['LP_P4_HTML_CSS_DIAGRAM']='class="diagram"' in lp_text and 'id="p4"' in lp_text
          qa['files']['LP_P9_REAL_SCREEN']='assets/presentation/medical-demo-desktop.png' in lp_text and 'id="p9"' in lp_text
          qa['files']['GUIDE_FIRST10']=sum(1 for n,_,_ in FIRST10)==10 and 'FIRST10 / EXACTLY 10 STEPS' in guide
          for k,v in qa['files'].items():
              if not v: qa['pass']=False; qa['errors'].append(k)

          # Protected core hash guard.
          after={p:sha(p) for p in PROTECTED}
          for p in PROTECTED:
              ok=before[p]==after[p]
              qa['protected_core'][p]={"before":before[p],"after":after[p],"pass":ok}
              if not ok: qa['pass']=False; qa['errors'].append(f'protected core changed: {p}')

          # File hashes.
          for p in [
           'guide-center.html','lp.html','DPRO_MEDICAL_A4_FLYER_MASTER_V2.0.html','DPRO_MEDICAL_A4_FLYER_MASTER_V2.0.pdf',
           'DPRO_MEDICAL_OWNER_EXPERIENCE_SHEET_V1.0.html','DPRO_MEDICAL_OWNER_EXPERIENCE_SHEET_V1.0.pdf',
           'DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.1.html','DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.1.pdf',
           'DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.1.html','DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.1.pdf',
           'DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.0.pdf','DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.0.pdf',
           'DPRO_MEDICAL_PRESENTATION_STANDARD_V1.0.json']:
              qa['files'][p]={"exists":(ROOT/p).exists(),"sha256":sha(p)}

          write('DPRO_MEDICAL_PRESENTATION_QA_REPORT_V1.0.json',json.dumps(qa,ensure_ascii=False,indent=2))
          md=['# DPRO MEDICAL PRESENTATION QA REPORT V1.0','',f"Overall: {'PASS' if qa['pass'] else 'FAIL'}",'', '## Scope','- Presentation only; product #51 / core / Worker / medical Supabase preserved.','- A4 MASTER V2.0: sales flyer 1 page + Owner experience sheet 1 page.','- LP MASTER V1.4: P1–P10.','- Tutorial STANDARD V1.1: First10=10 / Quick Start=3 pages / Detailed Manual=10 pages.','', '## PDF pages']
          for p,d in qa['pages'].items(): md.append(f"- {p}: {d['actual']}/{d['expected']} {'PASS' if d['pass'] else 'FAIL'}")
          md += ['', '## Responsive LP/Guide']
          for p,widths in qa['responsive'].items():
              md.append(f'- {p}: ' + ', '.join(f"{w}px={'PASS' if d['pass'] else 'FAIL'}" for w,d in widths.items()))
          md += ['', '## Protected core']
          md.append('- ' + ('PASS: protected files unchanged' if all(x['pass'] for x in qa['protected_core'].values()) else 'FAIL: protected file changed'))
          md += ['', '## Final status', '- Automated QA is not COMPLETE FINAL LOCK. Human visual QA of A4/LP/PDF is still required after Pages deployment.']
          if qa['errors']:
              md += ['', '## Errors'] + [f'- {e}' for e in qa['errors']]
          write('DPRO_MEDICAL_PRESENTATION_QA_REPORT_V1.0.md','\n'.join(md)+'\n')

          server.shutdown()
          if not qa['pass']:
              print(json.dumps(qa,ensure_ascii=False,indent=2))
              raise SystemExit('Presentation QA failed')
          print('DPRO MEDICAL presentation build/automated QA: PASS')

