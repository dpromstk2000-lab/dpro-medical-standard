name: DPRO MEDICAL Presentation Standard Apply V1.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-medical-presentation-standard-v1
  cancel-in-progress: false

jobs:
  presentation-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install browser / Japanese fonts / PDF tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python -m pip install --upgrade pip
          python -m pip install playwright qrcode[pil] pypdf pillow
          python -m playwright install --with-deps chromium

      - name: Build DPRO MEDICAL presentation standard
        shell: bash
        run: |
          cat > /tmp/dpro_medical_presentation_build.py <<'PY'
          from pathlib import Path
          import hashlib, html, json, os, shutil, subprocess, sys, threading, time
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler

          ROOT = Path.cwd()
          ASSET = ROOT / "assets" / "presentation"
          ASSET.mkdir(parents=True, exist_ok=True)

          BASE = "https://dpromstk2000-lab.github.io/dpro-medical-standard"
          DEMO = f"{BASE}/medical-public-demo.html"
          GUIDE = f"{BASE}/guide-center.html"
          LP = f"{BASE}/lp.html"
          PRODUCT = "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/medical.html"
          OFFICIAL = "https://dpro-shop.com/systems/medical"
          SYSTEM_CHECK = f"{BASE}/system-check.html"

          PROTECTED = [
              "medical-public-demo.html", "medical-tutorial.js", "index.html", "member.html",
              "owner.html", "owner-ipad.html", "staff.html", "system-check.html",
              "patient-reservation.html", "patient-questionnaire.html", "patient-reception.html",
              "patient-wait-status.html", "patient-digital-card.html"
          ]

          FIRST10 = [
              (1,"30秒体験を開始","公開DEMOの30秒導線を開始し、患者・医院・診療科の見方を確認します。"),
              (2,"患者スマホを開く","患者側の画面例へ切り替え、予約・問診・受付がまとまる入口を確認します。"),
              (3,"医院管理PCを見る","医院側の管理画面例へ切り替え、患者側と医院側が同じ流れでつながる構成を確認します。"),
              (4,"6診療科モデルを比較","STANDARD・眼科・小児科・整形外科・美容医療・婦人科/女性医療を比較します。"),
              (5,"眼科PRESETへ切替","眼科モデルへ切り替え、診療科ごとの表示差分を確認します。"),
              (6,"患者画面の役割を確認","患者スマホの予約・問診・受付入口を確認します。"),
              (7,"医院管理PCの役割を確認","予約・受付・待ち・診察中などの全体把握を確認します。"),
              (8,"受付iPadの役割を確認","受付業務に必要な情報へ集中した構成を確認します。"),
              (9,"スタッフ画面の役割を確認","スタッフ画面で院内進行と担当業務を確認します。"),
              (10,"医院HPの公開境界を確認","公開可能な予約導線・待ち状況・お知らせの見せ方を確認します。")
          ]

          SPECIALTIES = ["STANDARD / 一般・内科","EYE / 眼科","PEDIATRIC / 小児科","ORTHO / 整形外科","BEAUTY / 美容医療","WOMEN / 婦人科・女性医療"]
          FUNCTIONS = [
              ("01","予約","患者スマホから予約導線を整理"),
              ("02","WEB問診","来院前入力を医院運用につなぐ"),
              ("03","来院受付","受付iPad・医院側で来院を確認"),
              ("04","院内進行","受付済・待ち・診察などの状態を共有"),
              ("05","待ち状況","患者側でも現在状況を確認"),
              ("06","次回フォロー","診療後の次回導線まで一連で確認")
          ]


          def sha(path):
              p=ROOT/path
              if not p.exists(): return None
              return hashlib.sha256(p.read_bytes()).hexdigest()

          before={p:sha(p) for p in PROTECTED}


          def write(path, text):
              p=ROOT/path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')


          def qr_png(name, url):
              import qrcode
              img=qrcode.make(url)
              path=ASSET/f"qr-{name}.png"
              img.save(path)
              return f"assets/presentation/{path.name}"

          QR={
            "demo":qr_png("demo",DEMO),
            "guide":qr_png("guide",GUIDE),
            "product":qr_png("product",PRODUCT),
            "official":qr_png("official",OFFICIAL),
            "systemcheck":qr_png("system-check",SYSTEM_CHECK),
          }

          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self, *args): pass

          server = ThreadingHTTPServer(("127.0.0.1", 8000), Quiet)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          from playwright.sync_api import sync_playwright


          def safe_view_shot(page, selector, path):
              try:
                  loc=page.locator(selector)
                  if loc.count()>0:
                      loc.first.screenshot(path=str(path))
                      return True
              except Exception:
                  pass
              page.screenshot(path=str(path), full_page=False)
              return False

          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1440,"height":1000}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8000/medical-public-demo.html", wait_until="domcontentloaded")
              page.wait_for_timeout(700)
              page.screenshot(path=str(ASSET/"medical-demo-desktop.png"), full_page=True)
              for key, sel in [("owner",'.role-card[data-role="owner"]'),("patient",'.role-card[data-role="patient"]'),("ipad",'.role-card[data-role="ipad"]'),("staff",'.role-card[data-role="staff"]'),("hp",'.role-card[data-role="hp"]')]:
                  try:
                      if page.locator(sel).count():
                          page.locator(sel).first.click()
                          page.wait_for_timeout(250)
                  except Exception:
                      pass
                  safe_view_shot(page, "#viewer", ASSET/f"medical-{key}-screen.png")
              m=browser.new_page(viewport={"width":390,"height":844}, device_scale_factor=1)
              m.goto("http://127.0.0.1:8000/medical-public-demo.html", wait_until="domcontentloaded")
              m.wait_for_timeout(500)
              m.screenshot(path=str(ASSET/"medical-demo-mobile.png"), full_page=True)
              browser.close()

          COMMON_CSS='''
          :root{--ink:#15324a;--muted:#60758a;--line:#d7e4ec;--blue:#1769aa;--navy:#102d45;--soft:#eef6fb;--red:#a51743;--green:#187a63;--white:#fff;--shadow:0 16px 42px rgba(20,55,80,.10)}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f7fafc}a{color:inherit}.shell{width:min(1120px,calc(100% - 28px));margin:auto}.kicker{color:var(--red);font-size:12px;font-weight:950;letter-spacing:.12em}.btn{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:900;border:1px solid var(--line);background:#fff}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.note{font-size:12px;color:var(--muted);line-height:1.65}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
          '''

          # GUIDE CENTER
          steps=''.join(f'<article class="step"><b>{n:02d}</b><div><strong>{html.escape(t)}</strong><p>{html.escape(c)}</p></div></article>' for n,t,c in FIRST10)
          guide=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPRO MEDICAL Guide Center</title><meta name="robots" content="index,follow"><style>{COMMON_CSS}
          body{{background:#f4f8fb}}header{{background:var(--navy);color:#fff;padding:42px 0}}header h1{{font-size:clamp(34px,6vw,60px);margin:8px 0 12px}}header p{{color:#d6e5ee;line-height:1.8;max-width:820px}}.actions{{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}}main{{padding:42px 0 70px}}.guidebox{{padding:24px}}.step{{display:grid;grid-template-columns:50px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}}.step:last-child{{border-bottom:0}}.step>b{{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--blue)}}.step strong{{font-size:17px}}.step p{{margin:5px 0 0;color:var(--muted);line-height:1.65;font-size:14px}}.links{{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}}.links a{{padding:17px;text-decoration:none}}@media(max-width:720px){{.links{{grid-template-columns:1fr}}}}</style></head><body>
          <header><div class="shell"><div class="kicker" style="color:#ff9db8">DPRO MEDICAL / GUIDE CENTER / TUTORIAL STANDARD V1.1</div><h1>契約後も、自分で確認できる<br>操作ガイド。</h1><p>First10を基準に、患者・医院管理PC・受付iPad・スタッフ・医院HPの役割を順番に確認できます。公開DEMOは架空データで、本番書込みは行いません。</p><div class="actions"><a class="btn primary" href="medical-public-demo.html">Start / 公開DEMOで開始</a><a class="btn" href="medical-public-demo.html">Resume / 続きから</a><a class="btn" href="medical-public-demo.html">Replay / 最初から</a></div></div></header>
          <main class="shell"><section class="card guidebox"><div class="kicker">FIRST10 / EXACTLY 10 STEPS</div><h2>最初に見る10ステップ</h2>{steps}</section><section class="links"><a class="card" href="DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.1.pdf"><strong>Quick Start PDF</strong><p class="note">3ページ。導入直後の確認用。</p></a><a class="card" href="DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.1.pdf"><strong>詳細操作マニュアル</strong><p class="note">10ページ保存版。役割別・安全境界・System Checkまで。</p></a><a class="card" href="system-check.html"><strong>System Check</strong><p class="note">本番運用前の確認入口。</p></a></section><p class="note">DPRO MEDICALは医療行為そのものを代替するものではありません。診療判断・医療記録・個人情報の取扱いは、契約先医療機関の運用規程に従ってください。</p></main><script src="medical-tutorial.js"></script></body></html>'''
          write('guide-center.html',guide)

          # LP P1-P10
          func_cards=''.join(f'<article><b>{n}</b><strong>{html.escape(t)}</strong><p>{html.escape(c)}</p></article>' for n,t,c in FUNCTIONS)
          spec_cards=''.join(f'<span>{html.escape(x)}</span>' for x in SPECIALTIES)
          lp_html=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPRO MEDICAL｜医療機関向け導入LP</title><meta name="description" content="予約・WEB問診・来院受付・院内進行・待ち状況を患者スマホと医院運用につなぐDPRO MEDICAL。6診療科モデル・5画面の公開DEMOで確認できます。"><style>{COMMON_CSS}
          body{{overflow-x:hidden}}.sec{{padding:68px 0}}.soft{{background:var(--soft)}}.dark{{background:var(--navy);color:#fff}}.hero{{padding:78px 0 64px;background:linear-gradient(135deg,#eef7fc,#fff 55%,#fdf0f5)}}h1{{font-size:clamp(42px,7vw,78px);line-height:1.02;margin:12px 0 20px;letter-spacing:-.04em}}h2{{font-size:clamp(30px,4.5vw,48px);margin:7px 0 16px;line-height:1.18}}.lead{{font-size:clamp(17px,2vw,21px);line-height:1.8;color:#3f5d73;max-width:820px}}.actions{{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}}.grid3{{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}}.grid2{{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}}.panel{{padding:22px}}.panel p{{color:var(--muted);line-height:1.7}}.problem b{{color:var(--red)}}.diagram{{display:grid;grid-template-columns:1fr auto 1.3fr auto 1fr;gap:12px;align-items:center;margin-top:26px}}.node{{padding:20px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:center;color:var(--ink)}}.hub{{background:var(--red);color:#fff;border-color:var(--red)}}.arrow{{font-size:28px;font-weight:950}}.screens{{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:24px}}.screens img{{width:100%;border-radius:18px;border:1px solid var(--line);background:#fff}}.beforeafter{{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}}.before,.after{{padding:24px;border-radius:20px}}.before{{background:#fff4f4;border:1px solid #f0cccc}}.after{{background:#f2fbf7;border:1px solid #c9e5d8}}.price{{padding:26px}}.price strong{{font-size:28px}}.demoimg{{width:100%;border-radius:20px;border:1px solid rgba(255,255,255,.18);margin-top:24px}}.specialties{{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}}.specialties span{{padding:8px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:850}}.dark .specialties span{{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}}.final{{text-align:center}}.final .actions{{justify-content:center}}.label{{font-weight:950;color:var(--red);letter-spacing:.1em;font-size:12px}}@media(max-width:820px){{.grid3,.grid2,.screens,.beforeafter{{grid-template-columns:1fr}}.diagram{{grid-template-columns:1fr}}.arrow{{transform:rotate(90deg);text-align:center}}}}@media(max-width:560px){{.sec{{padding:48px 0}}.hero{{padding:52px 0}}.actions .btn{{width:100%}}}}</style></head><body>
          <section class="hero" id="p1"><div class="shell"><div class="label">P1 / FIRST VIEW</div><div class="kicker">DPRO MEDICAL / 6診療科モデル × 5画面</div><h1>予約だけで、<br><span style="color:var(--red)">終わらせない。</span></h1><p class="lead">患者スマホの予約・WEB問診・来院受付から、医院管理PC・受付iPad・スタッフ・医院HP・次回フォローまで。同じ情報基盤につなぎます。</p><div class="actions"><a class="btn primary" href="medical-public-demo.html">30秒LIVE DEMO</a><a class="btn dark" href="guide-center.html">Guide Center</a><a class="btn" href="{OFFICIAL}">料金・導入相談</a></div><div class="specialties">{spec_cards}</div></div></section>
          <section class="sec" id="p2"><div class="shell"><div class="label">P2 / OWNER PAIN</div><h2>患者対応が増えるほど、<br>情報が分かれやすくなる。</h2><div class="grid3 problem"><article class="card panel"><b>予約</b><p>予約情報だけが別管理になると、受付時に再確認が増えます。</p></article><article class="card panel"><b>問診・受付</b><p>来院前入力と当日受付がつながらないと、転記や確認が発生します。</p></article><article class="card panel"><b>院内進行</b><p>待ち・診察中などの状況が共有されないと、患者案内もスタッフ連携も遅れます。</p></article></div></div></section>
          <section class="sec soft" id="p3"><div class="shell"><div class="label">P3 / WHY PROBLEM</div><h2>入口が増えることより、<br>管理が分かれることが問題。</h2><div class="card panel"><p>WEB、LINE、受付、医院管理PC、スタッフ、医院HP。それぞれが別々の情報を持つと、同じ患者の状態を複数箇所で更新する必要が生まれます。DPRO MEDICALは、入口を無理に一つへ限定せず、医院側の管理を共通基盤へ寄せる設計です。</p></div></div></section>
          <section class="sec" id="p4"><div class="shell"><div class="label">P4 / CONNECTED SYSTEM</div><h2>入口は自由。管理は、ひとつ。</h2><div class="diagram"><div class="node">患者WEB / スマホ<br>予約・問診・受付</div><div class="arrow">→</div><div class="node hub"><b>DPRO MEDICAL</b><br>共通情報基盤</div><div class="arrow">→</div><div class="node">医院管理PC / iPad<br>Staff / 医院HP</div></div><div class="grid3">{func_cards}</div></div></section>
          <section class="sec soft" id="p5"><div class="shell"><div class="label">P5 / CUSTOMER EXPERIENCE</div><h2>患者は、必要な場面だけ迷わず操作。</h2><div class="screens"><div><img src="assets/presentation/medical-patient-screen.png" alt="患者画面の実画面"><p class="note">公開DEMOの実画面キャプチャ。架空データのみ。</p></div><div class="card panel"><strong>来院前</strong><p>予約・WEB問診。</p><strong>来院時</strong><p>受付と待ち状況確認。</p><strong>診療後</strong><p>次回導線や医院からの案内へ。</p></div></div></div></section>
          <section class="sec" id="p6"><div class="shell"><div class="label">P6 / OWNER & STAFF EXPERIENCE</div><h2>医院側は、役割に合わせた画面で確認。</h2><div class="screens"><img src="assets/presentation/medical-owner-screen.png" alt="医院管理PCの実画面"><div class="grid2"><article class="card panel"><strong>医院管理PC</strong><p>予約・受付・待ち・診察など全体を確認。</p></article><article class="card panel"><strong>受付iPad</strong><p>受付業務に必要な情報へ集中。</p></article><article class="card panel"><strong>スタッフ</strong><p>院内進行と担当業務を確認。</p></article><article class="card panel"><strong>医院HP</strong><p>公開してよい情報だけを患者へ表示。</p></article></div></div></div></section>
          <section class="sec soft" id="p7"><div class="shell"><div class="label">P7 / BEFORE → AFTER</div><h2>「確認して転記」から、<br>「同じ状態を見る」へ。</h2><div class="beforeafter"><div class="before"><h3>BEFORE</h3><p>予約・問診・受付・待ち状況が別々。電話や口頭確認、二重入力が増えやすい。</p></div><div class="after"><h3>AFTER</h3><p>患者側と医院側を共通基盤で接続。各役割が同じ流れを見ながら運用できます。</p></div></div></div></section>
          <section class="sec" id="p8"><div class="shell"><div class="label">P8 / PRICE & VALUE</div><h2>料金は、必要機能と導入条件を確認してご案内。</h2><div class="card price"><strong>数字を先に固定しません。</strong><p class="lead" style="font-size:16px">診療科、必要機能、運用範囲、LINEや公開サイトの構成で条件が変わるため、最新のDPRO SHOP／導入相談で確認します。このLPでは未確認の料金を表示しません。</p><a class="btn primary" href="{OFFICIAL}">DPRO SHOPで料金・導入を確認</a></div></div></section>
          <section class="sec dark" id="p9"><div class="shell"><div class="label" style="color:#ff9db8">P9 / LIVE DEMO</div><h2>説明ではなく、実画面で30秒。</h2><p style="color:#d6e5ee;line-height:1.8">6診療科モデルと5画面を、公開DEMOで切り替えて確認できます。使用するのは架空データで、本番書込みは行いません。</p><img class="demoimg" src="assets/presentation/medical-demo-desktop.png" alt="DPRO MEDICAL 公開DEMO実画面"><div class="actions"><a class="btn primary" href="medical-public-demo.html">LIVE DEMOを開く</a><a class="btn" href="guide-center.html">First10で見る</a></div></div></section>
          <section class="sec final" id="p10"><div class="shell"><div class="label">P10 / CONSULT & CTA</div><h2>自院の流れに合うか、<br>まず実画面で確認してください。</h2><p class="lead" style="margin-inline:auto">公開DEMO → Guide Center → 製品ページ → DPRO SHOPの順に確認できます。契約後の本番テナント・Owner登録はREADY工程で実施します。</p><div class="actions"><a class="btn primary" href="medical-public-demo.html">公開DEMO</a><a class="btn dark" href="{PRODUCT}">PRODUCT SITE</a><a class="btn" href="{OFFICIAL}">DPRO SHOP / 導入相談</a></div></div></section>
          </body></html>'''
          write('lp.html',lp_html)

          # A4 MASTER V2.0 sales flyer
          func6=''.join(f'<div class="fun"><b>{n} {html.escape(t)}</b><span>{html.escape(c)}</span></div>' for n,t,c in FUNCTIONS)
