name: DPRO MEDICAL TUTORIAL R5 MANUALS DEEPLINK FIX V1.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-tutorial-r5-manuals-fix-v1.yml"

permissions:
  contents: write

env:
  LIVE_BASE: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html
  ACCEPTED_R4_HEAD: 62baec59a1596e4b4a910c9c195aabdde6f65b7c
  QUICK_PDF: DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.0.pdf
  DETAIL_PDF: DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.0.pdf

jobs:
  r5-manuals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonical source re-lock and R4 preconditions
        shell: bash
        run: |
          echo "PRE_R5_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRE_R5_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$ACCEPTED_R4_HEAD" HEAD || { echo "R5 HOLD: accepted R4 is not ancestor of newest main"; exit 1; }
          test -f medical-public-demo.html
          test -f medical-tutorial.js
          python3 - <<'PY2'
          from pathlib import Path
          t=Path('medical-tutorial.js').read_text(encoding='utf-8')
          assert t.count("id:'medical-first10-") == 10
          assert 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R4' in t
          assert 'DPRO MEDICAL GUIDE CENTER STANDARD V1.1 / R4' in t
          assert 'R4 GUIDE FOCUS RECOVERY FIX V1.0' in t
          assert 'fetch(' not in t and 'XMLHttpRequest' not in t
          print('R4 source preconditions PASS')
          PY2
          echo "Newest canonical main: $(git rev-parse HEAD) / $(git rev-parse HEAD^{tree})"

      - name: Install R5 render and QA dependencies
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-ipafont-gothic poppler-utils zbar-tools
          python3 -m pip install --disable-pip-version-check reportlab 'qrcode[pil]' pypdf pillow

      - name: Prepare R5 scripts
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          data={
            'r5_live_capture.mjs':'',
            'r5_build_manuals.py':'',
            'r5_render_qa.py':'',
          }
          for n,s in data.items(): Path(n).write_bytes(base64.b64decode(s))
          PY2
          node --check r5_live_capture.mjs
          python3 -m py_compile r5_build_manuals.py r5_render_qa.py

      - name: Verify current LIVE Tutorial and Guide and capture screenshots
        shell: bash
        run: |
          node r5_live_capture.mjs
          python3 - <<'PY2'
          import json
          x=json.load(open('R5_LIVE_CAPTURE.json',encoding='utf-8'))
          assert x['pass'] is True
          assert x['first10Count'] == 10
          assert x['guideCount'] == 10
          assert x['tutorialDeepLink'] == 'PASS'
          assert x['guideDeepLink'] == 'PASS'
          assert x['pageErrors'] == []
          assert x['consoleErrors'] == []
          assert x['unsafeRequests'] == []
          assert x['businessMutation'] == 0
          print('R5 LIVE PRECONDITIONS PASS')
          PY2

      - name: Build A4 portrait Quick Start and Detailed Manual
        shell: bash
        run: |
          python3 r5_build_manuals.py
          test -s "r5_output/$QUICK_PDF"
          test -s "r5_output/$DETAIL_PDF"

      - name: Render every PDF page and decode every rendered QR
        shell: bash
        run: |
          python3 r5_render_qa.py
          python3 - <<'PY2'
          import json
          x=json.load(open('R5_RENDER_QA.json',encoding='utf-8'))
          assert x['pass'] is True
          assert len(x['renderedPages']) == 4
          assert x['gates']['QUICK_START_A4_PORTRAIT'] == 'PASS'
          assert x['gates']['DETAILED_A4_PORTRAIT'] == 'PASS'
          assert x['gates']['ALL_PDF_PAGES_RENDERED'] == 'PASS'
          assert x['gates']['QR_DECODE_EVERY_RENDERED_QR'] == 'PASS'
          assert x['gates']['QR_DESTINATION_EXACT_PUBLIC'] == 'PASS'
          print('R5 RENDER/QR AUTOMATED QA PASS')
          PY2

      - name: Publish manuals forward-only to canonical repo
        shell: bash
        run: |
          cp "r5_output/$QUICK_PDF" "$QUICK_PDF"
          cp "r5_output/$DETAIL_PDF" "$DETAIL_PDF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$QUICK_PDF" "$DETAIL_PDF"
          if git diff --cached --quiet; then
            echo "Manual PDFs already identical on newest main."
          else
            git commit -m "DPRO MEDICAL Tutorial R5 manuals"
            git push
          fi
          echo "R5_PDF_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R5_PDF_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Verify published manual PDFs are exact current public files
        shell: bash
        run: |
          QUICK_URL="https://dpromstk2000-lab.github.io/dpro-medical-standard/$QUICK_PDF"
          DETAIL_URL="https://dpromstk2000-lab.github.io/dpro-medical-standard/$DETAIL_PDF"
          qsha=$(sha256sum "$QUICK_PDF" | awk '{print $1}')
          dsha=$(sha256sum "$DETAIL_PDF" | awk '{print $1}')
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$QUICK_URL?qa=$(date +%s%N)" -o /tmp/quick-live.pdf &&                curl -fsSL -H 'Cache-Control: no-cache' "$DETAIL_URL?qa=$(date +%s%N)" -o /tmp/detail-live.pdf; then
              qlive=$(sha256sum /tmp/quick-live.pdf | awk '{print $1}')
              dlive=$(sha256sum /tmp/detail-live.pdf | awk '{print $1}')
              if [ "$qsha" = "$qlive" ] && [ "$dsha" = "$dlive" ]; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = "1" || { echo "R5 HOLD: published PDFs not exact/live"; exit 1; }
          echo "QUICK_PUBLIC_URL=$QUICK_URL" >> "$GITHUB_ENV"
          echo "DETAIL_PUBLIC_URL=$DETAIL_URL" >> "$GITHUB_ENV"
          echo "QUICK_SHA256=$qsha" >> "$GITHUB_ENV"
          echo "DETAIL_SHA256=$dsha" >> "$GITHUB_ENV"

      - name: Remove temporary R5 workflow after automated gates
        shell: bash
        run: |
          git rm -f .github/workflows/dpro-medical-tutorial-r5-manuals-v1.yml .github/workflows/dpro-medical-tutorial-r5-manuals-fix-v1.yml
          git commit -m "Remove temporary MEDICAL R5 workflow [skip ci]"
          git push
          echo "FINAL_R5_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_R5_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Build R5 evidence package for visual review
        shell: bash
        run: |
          cat > R5_SOURCE_LOCK.txt <<EOF2
          SYSTEM=MEDICAL
          PHASE=R5
          ACCEPTED_R4_HEAD=$ACCEPTED_R4_HEAD
          PRE_R5_HEAD=$PRE_R5_HEAD
          PRE_R5_TREE=$PRE_R5_TREE
          R5_PDF_HEAD=$R5_PDF_HEAD
          R5_PDF_TREE=$R5_PDF_TREE
          FINAL_R5_HEAD=$FINAL_R5_HEAD
          FINAL_R5_TREE=$FINAL_R5_TREE
          FORWARD_ONLY=PASS
          RESET_REVERT_FORCE_PUSH=0
          EOF2
          sed -i 's/^          //' R5_SOURCE_LOCK.txt
          python3 - <<'PY2'
          import json, os
          r=json.load(open('R5_RENDER_QA.json',encoding='utf-8'))
          q={'tutorialUrl':'https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html#dpro-tutorial-launcher',
             'guideUrl':'https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html#dpro-guide-launcher',
             'decoded':r['decoded'],
             'QR_DECODE_EVERY_RENDERED_QR':'PASS',
             'QR_DESTINATION_EXACT_PUBLIC':'PASS'}
          open('R5_QR_QA.json','w',encoding='utf-8').write(json.dumps(q,ensure_ascii=False,indent=2))
          status={
            'R4_CENTRAL':'ACCEPTED','CANONICAL_SOURCE_RELOCK':'PASS','R4_TUTORIAL_STILL_LIVE':'PASS','R4_GUIDE_STILL_LIVE':'PASS',
            'FIRST10_COUNT':10,'GUIDE_COUNT':10,'QUICK_START_A4_PORTRAIT':'PASS','DETAILED_A4_PORTRAIT':'PASS',
            'ALL_PDF_PAGES_RENDERED':'PASS','QR_DECODE_EVERY_RENDERED_QR':'PASS','QR_DESTINATION_EXACT_PUBLIC':'PASS',
            'CURRENT_LIVE_DEMO_SCREENSHOTS_ONLY':'PASS','UNSAFE_WRITE_REQUEST':0,'BUSINESS_MUTATION':0,
            'PUBLIC_QUICK_START':os.environ['QUICK_PUBLIC_URL'],'PUBLIC_DETAILED_MANUAL':os.environ['DETAIL_PUBLIC_URL'],
            'QUICK_SHA256':os.environ['QUICK_SHA256'],'DETAIL_SHA256':os.environ['DETAIL_SHA256'],
            'VISUAL_QA_EVERY_PAGE':'PENDING_ASSISTANT_REVIEW','PII_SENSITIVE_DATA':'PENDING_ASSISTANT_REVIEW',
            'CLIPPING':'PENDING_ASSISTANT_REVIEW','MISSING_GLYPH':'PENDING_ASSISTANT_REVIEW','BROKEN_IMAGE':'PENDING_ASSISTANT_REVIEW',
            'OVERLAP':'PENDING_ASSISTANT_REVIEW','UNREADABLE':'PENDING_ASSISTANT_REVIEW','R5':'PENDING_VISUAL_REVIEW','R6':'NOT_STARTED'
          }
          open('R5_AUTOMATED_QA_STATUS.json','w',encoding='utf-8').write(json.dumps(status,ensure_ascii=False,indent=2))
          PY2
          mkdir -p r5_evidence
          cp "$QUICK_PDF" "$DETAIL_PDF" R5_LIVE_CAPTURE.json R5_RENDER_QA.json R5_QR_QA.json R5_SOURCE_LOCK.txt R5_AUTOMATED_QA_STATUS.json r5_evidence/
          cp -r r5_rendered r5_capture r5_evidence/
          (cd r5_evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr DPRO_TUTORIAL_BATCH10_MEDICAL_R5_EVIDENCE_V1.0_20260830.zip r5_evidence
          unzip -t DPRO_TUTORIAL_BATCH10_MEDICAL_R5_EVIDENCE_V1.0_20260830.zip

      - name: Upload R5 visual-review evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R5_EVIDENCE_V1.0_20260830
          path: DPRO_TUTORIAL_BATCH10_MEDICAL_R5_EVIDENCE_V1.0_20260830.zip
          if-no-files-found: error
          retention-days: 14
