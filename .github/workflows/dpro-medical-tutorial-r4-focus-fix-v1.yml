name: DPRO MEDICAL TUTORIAL R4 FOCUS RECOVERY FIX V1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-tutorial-r4-focus-fix-v1.yml"

permissions:
  contents: write

env:
  LIVE_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html
  LIVE_JS_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-tutorial.js
  R3_HEAD_LOCK: 5250f937733f314fac866d033214f5b6bf2a9fd3
  R3_TREE_LOCK: 8250b763723b6c35821a95f077a1a2353330b787
  R4_INITIAL_HEAD_LOCK: 431c5da90357c6a2d3bbe54a3a687ce0e9226b54
  R4_INITIAL_TREE_LOCK: 8226dc1104fb74a52c74f3bd146874f35419f417
  ORIGINAL_RUN_ID: "33262252866"

jobs:
  r4-focus-recovery-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record newest source lock and enforce forward-only
        shell: bash
        run: |
          echo "PRE_FIX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRE_FIX_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$R3_HEAD_LOCK" HEAD || { echo "HOLD: R3 PASS commit is not an ancestor of newest main"; exit 1; }
          git merge-base --is-ancestor "$R4_INITIAL_HEAD_LOCK" HEAD || { echo "HOLD: initial R4 commit is not an ancestor of newest main"; exit 1; }
          test -f medical-public-demo.html
          test -f medical-tutorial.js
          test -f .github/workflows/dpro-medical-tutorial-r3-r4-v1.yml
          echo "Newest main: $(git rev-parse HEAD) / $(git rev-parse HEAD^{tree})"

      - name: Patch only R4 Guide Escape focus recovery
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('medical-tutorial.js')
          text=p.read_text(encoding='utf-8')
          marker='R4 GUIDE FOCUS RECOVERY FIX V1.0'
          if marker not in text:
              old_open="function open(){build();ui.panel.hidden=false;setTimeout(()=>ui.close.focus({preventScroll:true}),0);return snapshot();}"
              new_open="// R4 GUIDE FOCUS RECOVERY FIX V1.0: never leave Tutorial overlay open behind Guide Center.\n  function open(){build();if(T&&typeof T.close==='function')T.close(false);ui.panel.hidden=false;setTimeout(()=>ui.close.focus({preventScroll:true}),0);return snapshot();}"
              old_esc="document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui&&!ui.panel.hidden){e.preventDefault();close();}},true);"
              new_esc="document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui&&!ui.panel.hidden){e.preventDefault();e.stopImmediatePropagation();close();}},true);"
              if text.count(old_open) != 1:
                  raise SystemExit('HOLD: Guide open() patch point not exactly one')
              if text.count(old_esc) != 1:
                  raise SystemExit('HOLD: Guide Escape patch point not exactly one')
              text=text.replace(old_open,new_open,1).replace(old_esc,new_esc,1)
              p.write_text(text,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert marker in check
          assert "T.close(false);ui.panel.hidden=false" in check
          assert "e.stopImmediatePropagation();close();" in check
          assert check.count("id:'medical-first10-") == 10
          assert 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R4' in check
          assert 'DPRO MEDICAL GUIDE CENTER STANDARD V1.1 / R4' in check
          assert 'fetch(' not in check and 'XMLHttpRequest' not in check
          print('R4 focus recovery static fix PASS')
          PY2
          node --check medical-tutorial.js

      - name: Commit R4 focus recovery fix forward-only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medical-tutorial.js
          if git diff --cached --quiet; then
            echo "R4 focus recovery fix already present."
          else
            git commit -m "DPRO MEDICAL Tutorial R4 Guide focus recovery fix"
            git push
          fi
          echo "R4_FIX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R4_FIX_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for fixed R4 public LIVE
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_JS_URL?qa=$(date +%s%N)" -o /tmp/live-r4-fix.js &&                grep -q 'DPRO MEDICAL TUTORIAL STANDARD V1.1 / R4' /tmp/live-r4-fix.js &&                grep -q 'DPRO MEDICAL GUIDE CENTER STANDARD V1.1 / R4' /tmp/live-r4-fix.js &&                grep -q 'R4 GUIDE FOCUS RECOVERY FIX V1.0' /tmp/live-r4-fix.js; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = "1" || { echo "R4 HOLD: fixed public LIVE marker not updated"; exit 1; }

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare full R3 revalidation and R4 LIVE QA
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          q3=""
          q4=""
          Path('qa-r3-revalidation.mjs').write_bytes(base64.b64decode(q3))
          Path('qa-r4.mjs').write_bytes(base64.b64decode(q4))
          PY2
          node --check qa-r3-revalidation.mjs
          node --check qa-r4.mjs

      - name: Revalidate R3 exact four-width gates on fixed R4
        shell: bash
        run: |
          node qa-r3-revalidation.mjs
          cp tutorial-qa-results.json R3_QA_EVIDENCE.json
          python3 - <<'PY2'
          import json
          x=json.load(open('R3_QA_EVIDENCE.json',encoding='utf-8'))
          assert x['pass'] is True
          assert x['global']['BUSINESS_MUTATION'] == 0
          assert len(x['viewports']) == 4
          print('R3 REVALIDATION FULL PASS')
          PY2

      - name: R4 exact four-width public LIVE QA after focus fix
        shell: bash
        run: |
          node qa-r4.mjs
          cp r4-qa-results.json R4_QA_EVIDENCE.json
          python3 - <<'PY2'
          import json
          x=json.load(open('R4_QA_EVIDENCE.json',encoding='utf-8'))
          assert x['pass'] is True
          assert x['global']['GUIDE_COUNT'] == 10
          assert x['global']['FIRST10_COUNT'] == 10
          assert x['global']['BUSINESS_MUTATION'] == 0
          assert len(x['viewports']) == 4
          for name in ('1440x1000','1024x768','390x844','320x720'):
              assert name in x['viewports']
          print('R4 FULL PASS AFTER FOCUS RECOVERY FIX')
          PY2

      - name: Remove temporary MEDICAL R3-R4 workflows after full PASS
        shell: bash
        run: |
          git rm -f .github/workflows/dpro-medical-tutorial-r3-r4-v1.yml .github/workflows/dpro-medical-tutorial-r4-focus-fix-v1.yml
          git commit -m "Remove temporary MEDICAL R3-R4 workflows [skip ci]"
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Build R4 CENTRAL RETURN ZIP
        shell: bash
        run: |
          mkdir -p central_return
          cat > central_return/00_START_HERE.txt <<EOF2
          DPRO TUTORIAL BATCH-10 / MEDICAL / R4 CENTRAL RETURN
          VERSION V1.0 / 2026-08-30 JST
          R2_CENTRAL=ACCEPTED
          R3=PASS
          R4=PASS
          FIRST10_COUNT=10
          GUIDE_COUNT=10
          BUSINESS_MUTATION=0
          FORWARD_ONLY=PASS
          R5=NOT_STARTED_NOT_AUTHORIZED
          R6=NOT_STARTED_NOT_AUTHORIZED
          R7=NOT_AUTHORIZED_NOT_EXECUTED
          FINAL_LOCK=CENTRAL_DECISION_ONLY
          EOF2
          sed -i 's/^          //' central_return/00_START_HERE.txt

          cat > central_return/STATUS.txt <<EOF2
          SYSTEM=MEDICAL
          BATCH=10
          R2_CENTRAL=ACCEPTED
          R3_ORIGINAL_RUN_ID=$ORIGINAL_RUN_ID
          R3_ORIGINAL_QA=PASS
          R3_REVALIDATION_AFTER_R4_FIX=PASS
          R3=PASS
          R4_INITIAL_QA=HOLD_GUIDE_ESCAPE_FOCUS_RECOVERY
          R4_FOCUS_RECOVERY_FIX=PASS
          R4=PASS
          FIRST10_COUNT=10
          GUIDE_COUNT=10
          GUIDE_TUTORIAL_ALIGNMENT=PASS
          BUSINESS_MUTATION=0
          FORWARD_ONLY=PASS
          R5=NOT_STARTED_NOT_AUTHORIZED
          R6=NOT_STARTED_NOT_AUTHORIZED
          R7=NOT_AUTHORIZED_NOT_EXECUTED
          FINAL_LOCK=CENTRAL_DECISION_ONLY
          EOF2
          sed -i 's/^          //' central_return/STATUS.txt

          cat > central_return/SOURCE_LOCK_R4.txt <<EOF2
          REPOSITORY=https://github.com/dpromstk2000-lab/dpro-medical-standard
          R2_ACCEPTED_HEAD=7753ed489e991c12f73b8a217ac070375f59f4af
          PRE_R3_HEAD=1780808bc99b1f9c971ad80b052e3ca629f9ceff
          PRE_R3_TREE=db375fe744fc06c23076e4101bc34930aebc342d
          R3_HEAD=$R3_HEAD_LOCK
          R3_TREE=$R3_TREE_LOCK
          R4_INITIAL_HEAD=$R4_INITIAL_HEAD_LOCK
          R4_INITIAL_TREE=$R4_INITIAL_TREE_LOCK
          PRE_FIX_HEAD=$PRE_FIX_HEAD
          PRE_FIX_TREE=$PRE_FIX_TREE
          R4_FIX_HEAD=$R4_FIX_HEAD
          R4_FIX_TREE=$R4_FIX_TREE
          FINAL_HEAD=$FINAL_HEAD
          FINAL_TREE=$FINAL_TREE
          FORWARD_ONLY=PASS
          RESET_REVERT_FORCE_PUSH=0
          EOF2
          sed -i 's/^          //' central_return/SOURCE_LOCK_R4.txt

          cat > central_return/R2_ACCEPTED_CONTRACT.txt <<'EOF2'
          R2_CENTRAL=ACCEPTED
          FIRST10_COUNT=10
          FIRST10_UNIQUE_IDS=10
          ROUTE=/medical-public-demo.html
          SAFE_QUERY_PARAMETERS=NONE
          CROSS_PAGE=NO
          BUSINESS_MUTATION_DESIGN=0
          Accepted First10 IDs/orders/selectors/fallbacks preserved exactly from R2 CENTRAL acceptance.
          EOF2
          sed -i 's/^          //' central_return/R2_ACCEPTED_CONTRACT.txt

          cat > central_return/R3_CHANGED_FILES.txt <<'EOF2'
          medical-public-demo.html
          medical-tutorial.js
          R3 changes are Tutorial-only: loader + Tutorial runtime.
          Original R3 exact four-width LIVE QA PASS in workflow run 33262252866.
          R3 gates were revalidated after the R4 focus recovery fix and remained PASS.
          No Worker/Supabase/DB/API/Auth/Role/Permission/Feature Flag/Product Site change.
          EOF2
          sed -i 's/^          //' central_return/R3_CHANGED_FILES.txt
          cp R3_QA_EVIDENCE.json central_return/R3_QA_EVIDENCE.json

          cat > central_return/R4_CHANGED_FILES.txt <<'EOF2'
          medical-tutorial.js
          Initial R4 added Guide Center over the same First10 array and same Tutorial state/storage.
          Initial R4 LIVE QA HOLD was limited to Guide Escape focus recovery at 1440x1000.
          Forward-only focus fix: opening Guide closes the Tutorial overlay without changing Tutorial state; Guide Escape owns the event and restores focus to the Guide launcher.
          Full R4 exact four-width LIVE QA PASS after the fix.
          EOF2
          sed -i 's/^          //' central_return/R4_CHANGED_FILES.txt
          cp R4_QA_EVIDENCE.json central_return/R4_QA_EVIDENCE.json

          cat > central_return/PROTECTED_BOUNDARIES.txt <<'EOF2'
          Worker change=0
          Supabase/DB change=0
          API contract change=0
          Auth change=0
          Role/Permission change=0
          Feature Flag change=0
          Product Site change=0
          Real patient/health/appointment/queue/visit/treatment data used=0
          Unsafe write request during Tutorial/Guide QA=0
          Business mutation=0
          BRUSHUP-7/8/9/10 reopened=0
          BRUSHUP-6 external LINE HOLD unchanged/separate
          EOF2
          sed -i 's/^          //' central_return/PROTECTED_BOUNDARIES.txt

          cat > central_return/NEXT_ACTION.txt <<'EOF2'
          1. Upload DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip to DPRO TUTORIAL CENTRAL.
          2. STOP in MEDICAL child chat.
          3. Do not start R5/R6/R7. FINAL LOCK is CENTRAL decision only.
          EOF2
          sed -i 's/^          //' central_return/NEXT_ACTION.txt

          (cd central_return && sha256sum 00_START_HERE.txt STATUS.txt SOURCE_LOCK_R4.txt R2_ACCEPTED_CONTRACT.txt R3_CHANGED_FILES.txt R3_QA_EVIDENCE.json R4_CHANGED_FILES.txt R4_QA_EVIDENCE.json PROTECTED_BOUNDARIES.txt NEXT_ACTION.txt > SHA256.txt)
          (cd central_return && zip -q -j ../DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip ./*)
          unzip -t DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip
          unzip -l DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip

      - name: Upload CENTRAL RETURN artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830
          path: DPRO_TUTORIAL_BATCH10_MEDICAL_R4_CENTRAL_RETURN_V1.0_20260830.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload R3-R4 QA evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R3-R4_QA_EVIDENCE_V1.1_20260830
          path: |
            R3_QA_EVIDENCE.json
            R4_QA_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
