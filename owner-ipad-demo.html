<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>受付iPad 公開DEMO | DPRO MEDICAL</title>
  <meta name="description" content="DPRO MEDICAL 受付iPadの公開DEMO。架空データのみを使い、本番患者情報・本番認証情報は使用しません。">
  <link rel="stylesheet" href="clinic.css">
  <style>
    .demo-banner{margin:0 0 14px;padding:11px 13px;border:1px solid #cfe2d8;border-radius:12px;background:#edf8f1;color:#176b5c;font-size:13px;font-weight:700}
    .demo-banner small{display:block;margin-top:3px;color:#60707d;font-weight:500}
  </style>
</head>
<body>
  <main class="ipad-shell">
    <div class="demo-banner">
      DPRO MEDICAL 受付iPad 公開DEMO
      <small>架空のサンプルデータだけで動作します。本番患者情報・本番認証情報・秘密鍵は使用しません。</small>
    </div>

    <header class="ipad-top">
      <div><div class="muted">DPRO MEDICAL</div><h1 style="margin:2px 0">院内オペレーション</h1></div>
    </header>

    <div class="grid ipad-actions">
      <div class="card"><span class="muted">受付済</span><strong data-kpi="checkedIn"></strong></div>
      <div class="card"><span class="muted">現在待ち</span><strong data-kpi="waitingNow"></strong></div>
      <div class="card"><span class="muted">診察中</span><strong data-kpi="consultingNow"></strong></div>
      <div class="card"><span class="muted">平均待ち</span><strong><span data-kpi="avgWaitMin"></span>分</strong></div>
    </div>

    <div class="staff-nav">
      <button class="btn primary active" data-nav="ipad-today">本日の患者</button>
      <button class="btn" data-nav="ipad-reception">受付</button>
      <button class="btn" data-nav="ipad-workflow">院内状況</button>
      <button class="btn" data-nav="ipad-questionnaire">問診</button>
    </div>

    <section id="ipad-today" class="section active"><div data-render="today"></div></section>
    <section id="ipad-reception" class="section"><div data-render="reception"></div></section>
    <section id="ipad-workflow" class="section"><div data-render="workflow"></div></section>
    <section id="ipad-questionnaire" class="section"><div data-render="questionnaire"></div></section>

    <p class="permission-note">公開DEMOでは架空データのみを使用しています。実運用ではスタッフ認証と権限確認を通して利用します。</p>
  </main>

  <script>
    window.DPRO_MEDICAL_CLINIC_ROLE_HINT = "owner";
    window.DPRO_MEDICAL_CLINIC_RUNTIME_INPUT = Object.freeze({
      environmentMode: "demo",
      mockMode: true,
      explicitMockSelector: true
    });
  </script>
  <script src="config.js"></script>
  <script src="clinic-runtime-config.js"></script>
</body>
</html>
