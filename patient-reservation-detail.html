<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約確認・変更・キャンセル | DPRO MEDICAL</title><script src="config.js"></script><script src="auth-supabase-auth-client.js"></script><script src="patient-runtime-config.js"></script><script src="patient-api-adapter.js"></script><style>
:root{--bg:#f5f8fb;--card:#fff;--ink:#17324a;--muted:#637587;--line:#d9e4ec;--accent:#1769aa;--soft:#eaf4fb;--warn:#fff7e7;--ok:#edf8f1;--danger:#a92f2f;--dangerbg:#fff1f1}
*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 40px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.clinic{font-size:18px;font-weight:850}.user{font-size:14px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(22,50,75,.05)}.status{background:var(--soft)}.warn{background:var(--warn)}.ok{background:var(--ok)}.error{background:var(--dangerbg);border-color:#e9bbbb;color:#7e2222}h1{font-size:23px;line-height:1.35;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.65;margin:8px 0}.small{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:760;text-align:center;cursor:pointer;font-size:15px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:#fff;color:var(--danger);border-color:#e5bcbc}.btn.wide{grid-column:1/-1;width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:760}.big-number{font-size:42px;font-weight:900;line-height:1}label{display:block;font-weight:760;margin:14px 0 6px}input,select,textarea{width:100%;min-height:48px;padding:12px 13px;border-radius:12px;border:1px solid #c8d7e2;background:#fff;font:inherit;color:var(--ink)}input[type=checkbox],input[type=radio]{width:auto;min-height:auto}.checkrow{display:flex;align-items:flex-start;gap:8px;margin:9px 0}.checkrow label{margin:0;font-weight:500}.options{display:grid;gap:8px}.options .checkrow{padding:8px 10px;border:1px solid var(--line);border-radius:10px}.field-error{font-size:13px;color:#982d2d;margin-top:5px}textarea{min-height:108px;resize:vertical}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}nav a{color:var(--accent);font-size:14px;text-decoration:none;font-weight:700}.note{padding:11px 12px;border-radius:12px;background:#fff8e8;font-size:13px;line-height:1.55}hr{border:0;border-top:1px solid var(--line);margin:16px 0}.list{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.meta{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px}.meta div:nth-child(odd){color:var(--muted)}.hidden{display:none!important}.mutedbox{padding:18px;border:1px dashed #b9c9d5;border-radius:14px;text-align:center;color:var(--muted);background:#fbfdff}.success-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.spinner{opacity:.65}.nowrap{white-space:nowrap}
@media(max-width:430px){.wrap{padding-left:14px;padding-right:14px}.meta{grid-template-columns:115px 1fr}.btn{min-height:50px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.btn.wide{grid-column:auto}.meta{grid-template-columns:1fr}.meta div:nth-child(odd){font-size:12px;margin-top:4px}}
@media(max-width:360px){.wrap{padding-left:11px;padding-right:11px}h1{font-size:21px}.card{padding:14px}.btn{font-size:14px}}
</style></head><body><main class="wrap"><nav><a href="member.html">← 患者TOP</a></nav>
<div id="errorBox" class="card error hidden" role="alert"></div><div id="picker" class="card hidden"><h1>予約を選択</h1><div id="appointmentList" class="list"></div></div>
<div id="detail" class="hidden"><div class="card"><h1>予約確認</h1><div class="meta"><div>appointment_id</div><div id="appointmentId" class="success-id"></div><div>予約種別</div><div id="typeId"></div><div>booking_mode</div><div id="bookingMode"></div><div>予約日時</div><div id="currentTime"></div><div>状態</div><div id="statusLabel"></div></div></div>
<div class="card"><h2>予約を変更</h2><label for="changeDate">変更後の日付</label><input id="changeDate" type="date"><button id="loadChangeSlots" class="btn wide" type="button">変更可能枠を表示</button><label for="changeSlot">変更後の枠</label><select id="changeSlot"><option value="">枠を取得してください</option></select><button id="changePreview" class="btn primary wide" type="button">変更内容を確認</button><div id="changeConfirm" class="card status hidden"><strong>変更確認</strong><p id="changeText"></p><button id="changeSubmit" class="btn primary wide" type="button">変更を確定</button></div></div>
<div class="card warn"><h2>予約をキャンセル</h2><label for="cancelReason">キャンセル理由（任意）</label><textarea id="cancelReason" placeholder="例：予定変更のため"></textarea><button id="cancelOpen" class="btn danger wide" type="button">キャンセル手続きへ</button><div id="cancelConfirm" class="card hidden"><strong>本当にキャンセルしますか？</strong><p>この操作は二段階確認です。</p><button id="cancelSubmit" class="btn danger wide" type="button">キャンセルを確定</button></div></div></div>
<div id="success" class="card ok hidden"><h2 id="successTitle"></h2><p id="successBody"></p></div>
<script>(async()=>{
let api,appointments=[],appt=null,changeSlots=[],changeSlot=null,busy=false;const $=id=>document.getElementById(id);function error(msg,code){$("errorBox").textContent=msg+(code?` (${code})`:"");$("errorBox").classList.remove("hidden");}function clearError(){$("errorBox").classList.add("hidden");}
function render(){if(!appt)return;$("detail").classList.remove("hidden");$("appointmentId").textContent=appt.appointment_id;$("typeId").textContent=appt.appointment_type_id||"-";$("bookingMode").textContent=appt.booking_mode||"-";$("currentTime").textContent=`${appt.start_at||appt.appointment_date||"-"}${appt.end_at?` 〜 ${appt.end_at}`:""}`;$("statusLabel").textContent=`${appt.status||"-"} / ${DPRO_MEDICAL_PATIENT_API.getStatusLabel(appt.status)}`;$("changeDate").value=(appt.appointment_date||"").slice(0,10);}
function choose(id){appt=appointments.find(a=>a.appointment_id===id)||null;if(!appt){error("予約を確認できませんでした。");return;}history.replaceState(null,"",`?appointment_id=${encodeURIComponent(id)}`);$("picker").classList.add("hidden");render();}
async function loadSlots(){clearError();try{const r=await api.getAppointmentSlots({date:$("changeDate").value,appointment_type_id:appt.appointment_type_id});changeSlots=(r.data||[]).filter(s=>s.appointment_slot_id&&s.available!==false);$("changeSlot").innerHTML='<option value="">選択してください</option>'+changeSlots.map(s=>`<option value="${s.appointment_slot_id}">${s.start_at} 〜 ${s.end_at}</option>`).join("");}catch(e){error("変更可能な予約枠を取得できませんでした。",e.code);}}
function preview(){clearError();changeSlot=changeSlots.find(s=>s.appointment_slot_id===$("changeSlot").value)||null;if(!changeSlot){error("変更後の予約枠を選択してください。");return;}$("changeText").textContent=`${changeSlot.start_at} 〜 ${changeSlot.end_at} へ変更します。`;$("changeConfirm").classList.remove("hidden");}
async function submitChange(){if(busy||!changeSlot)return;busy=true;$("changeSubmit").disabled=true;try{const r=await api.rescheduleAppointment({appointment_id:appt.appointment_id,appointment_slot_id:changeSlot.appointment_slot_id,appointment_date:changeSlot.appointment_date||$("changeDate").value,start_at:changeSlot.start_at,end_at:changeSlot.end_at});appt={...appt,...r.data};render();$("changeConfirm").classList.add("hidden");$("successTitle").textContent="予約を変更しました";$("successBody").textContent=`現在の状態: ${appt.status||"-"} / ${DPRO_MEDICAL_PATIENT_API.getStatusLabel(appt.status)}`;$("success").classList.remove("hidden");}catch(e){error("予約変更に失敗しました。もう一度お試しください。",e.code);}finally{busy=false;$("changeSubmit").disabled=false;}}
async function submitCancel(){if(busy)return;busy=true;$("cancelSubmit").disabled=true;try{const r=await api.cancelAppointment({appointment_id:appt.appointment_id,cancel_reason:$("cancelReason").value.trim()||undefined});appt={...appt,...r.data};render();$("cancelConfirm").classList.add("hidden");$("successTitle").textContent="キャンセル処理が完了しました";$("successBody").textContent=`現在の状態: ${appt.status||"-"} / ${DPRO_MEDICAL_PATIENT_API.getStatusLabel(appt.status)}`;$("success").classList.remove("hidden");}catch(e){error("キャンセル処理に失敗しました。もう一度お試しください。",e.code);}finally{busy=false;$("cancelSubmit").disabled=false;}}
try{const runtime=await DPRO_MEDICAL_PATIENT_API.prepareRuntime();api=DPRO_MEDICAL_PATIENT_API.createPatientApiAdapter(runtime);const top=await api.getPatientTop();appointments=top.data.appointments||[];const requested=new URLSearchParams(location.search).get("appointment_id");if(requested)appt=appointments.find(a=>a.appointment_id===requested)||null;if(!appt){$("picker").classList.remove("hidden");$("appointmentList").innerHTML=appointments.length?appointments.map(a=>`<button type="button" class="btn wide" data-id="${a.appointment_id}">${a.start_at||a.appointment_date||"予約"} / ${DPRO_MEDICAL_PATIENT_API.getStatusLabel(a.status)}</button>`).join(""):'<div class="note">変更・キャンセルできる予約がありません。</div>';$("appointmentList").querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.id)));}else render();$("loadChangeSlots").addEventListener("click",loadSlots);$("changePreview").addEventListener("click",preview);$("changeSubmit").addEventListener("click",submitChange);$("cancelOpen").addEventListener("click",()=>$("cancelConfirm").classList.remove("hidden"));$("cancelSubmit").addEventListener("click",submitCancel);}catch(e){error("予約情報を読み込めませんでした。",e.code);}
})();</script></main></body></html>
